name: Forebet supplement refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_forebet_supplement.py"
      - "scripts/merge_forebet_supplement.py"
      - ".github/workflows/forebet-supplement.yml"
  schedule:
    - cron: "30 22,10 * * *"

permissions:
  contents: write

concurrency:
  group: forebet-supplement-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.12.3
      - name: Refresh supplement when Forebet permits runner access
        run: |
          if python scripts/update_forebet_supplement.py; then
            echo "Forebet supplement refreshed"
          else
            echo "Forebet blocked the GitHub runner; preserving last-good supplement"
          fi
      - run: python scripts/merge_forebet_supplement.py
      - name: Commit supplement CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/forebet_supplement_current.csv data/forebet_current.csv
          if git diff --cached --quiet; then
            echo "No supplement changes"
          else
            git commit -m "Refresh Forebet supplement feed"
            git pull --rebase origin main
            git push
          fi
