name: Phase 3 Fast Lane

on:
  workflow_dispatch:
  push:
    branches: [phase3-live-intelligence]
    paths:
      - 'phase3/fast_lane.py'
      - 'scripts/phase3_collect_fast_lane.py'
      - 'tests/test_phase3_fast_lane*.py'
      - '.github/workflows/phase3_fast_lane.yml'
  schedule:
    - cron: '2,17,32,47 * * * *'

permissions:
  contents: read

concurrency:
  group: phase3-fast-lane
  cancel-in-progress: true

jobs:
  heartbeat:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Phase 3 ref
        uses: actions/checkout@v4
        with:
          ref: phase3-live-intelligence
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persistent Layer 2 identity state
        uses: actions/cache/restore@v4
        with:
          path: |
            data/phase3_identity_evidence.jsonl
            data/phase3_live_identity_map.json
            data/phase3_identity_source_health.json
            data/phase3_identity_exceptions.json
          key: phase3-fast-read-${{ github.run_id }}
          restore-keys: |
            phase3-identity-
      - name: Restore Layer 3 last-good state
        uses: actions/cache/restore@v4
        with:
          path: data/phase3_fast_last_good.json
          key: phase3-fast-state-${{ github.run_id }}
          restore-keys: |
            phase3-fast-state-
      - name: Run Layer 3 deterministic tests
        run: python -m unittest discover -s tests -p 'test_phase3_fast_lane*.py' -v
      - name: Collect fast heartbeat
        run: PYTHONPATH=. python scripts/phase3_collect_fast_lane.py
      - name: Diagnose fast snapshot
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          d=json.loads(Path('data/phase3_fast_snapshot.json').read_text())
          t=datetime.fromisoformat(d['fast_snapshot_at'])
          age=max(0,(datetime.now(timezone.utc)-t).total_seconds())
          requests=int(d.get('request_count') or 0)
          primary=int(d.get('primary_board_requests') or 0)
          fallback=int(d.get('fallback_board_requests') or 0)
          mapped=int(d.get('mapped_rows') or 0)
          live=int(d.get('live_rows') or 0)
          terminal=int(d.get('terminal_rows') or 0)
          print(
              f"PHASE3_FAST_DIAG health={d['health']} age_seconds={age:.1f} "
              f"verified_targets={d['verified_targets']} requests={requests} "
              f"primary_requests={primary} fallback_requests={fallback} "
              f"failures={d['request_failures']} mapped={mapped} live={live} "
              f"terminal={terminal} unmapped={d['unmapped_count']} "
              f"missing_targets={len(d.get('missing_target_ids') or [])} "
              f"last_good_health={d.get('last_good_health')} "
              f"last_good_age={d['last_good_age_seconds']}"
          )
          if age > 180:
              raise SystemExit('fast snapshot unexpectedly stale')
          if requests != primary + fallback:
              raise SystemExit('fast request accounting mismatch')
          if requests > 3:
              raise SystemExit('fast path exceeded bounded one-board-plus-boundary request budget')
          if primary > 1:
              raise SystemExit('fast path made more than one primary multi-match board request')
          PY
      - name: Save Layer 3 last-good state
        if: ${{ always() && hashFiles('data/phase3_fast_last_good.json') != '' }}
        uses: actions/cache/save@v4
        with:
          path: data/phase3_fast_last_good.json
          key: phase3-fast-state-${{ github.run_id }}
      - name: Upload Layer 3 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase3-fast-evidence-${{ github.run_id }}
          path: |
            data/phase3_fast_snapshot.json
            data/phase3_fast_last_good.json
          if-no-files-found: warn
          retention-days: 3