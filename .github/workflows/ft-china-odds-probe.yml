name: FT one-shot China odds reachability probe
on:
  push:
    branches:
      - probe/ft-china-odds-20261010
    paths:
      - .github/workflows/ft-china-odds-probe.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: One request each; validate match/odds fields without publishing
        shell: bash
        run: |
          python - <<'PY'
          import datetime, json, urllib.request, xml.etree.ElementTree as ET
          from urllib.error import URLError,HTTPError
          checks = {
              "500_direct_xml": "https://trade.500.com/static/public/jczq/newxml/pl/pl_spf_2.xml",
              "500_direct_euro": "https://odds.500.com/fenxi/ouzhi-1420445.shtml",
              "sporttery_direct": "https://webapi.sporttery.cn/gateway/jc/football/getMatchCalculatorV1.qry",
              "500_github_mirror": "https://raw.githubusercontent.com/nelsonie/caipiao/main/site/index.json",
          }
          all_results = {}
          for key, url in checks.items():
              try:
                  req = urllib.request.Request(url, headers={"User-Agent":"Mozilla/5.0 (FastTrackerReadOnlyProbe/1.0)"})
                  with urllib.request.urlopen(req,timeout=12) as response:
                      body = response.read(900_000)
                      status = response.status
                  result={"http_status": status, "body_bytes":len(body), "usable":False}
                  if key == "500_direct_xml":
                      root=ET.fromstring(body)
                      valid=[m for m in root.findall("m") if m.attrib.get("matchnum") and m.find("row") is not None]
                      sample=valid[0] if valid else None
                      result.update({"xml_matches":len(valid),"sample_date":sample.get("date") if sample is not None else None, "usable":bool(valid)})
                  elif key == "500_direct_euro":
                      txt=body.decode("gb18030",errors="ignore").lower()
                      result.update({"looks_like_euro_odds":("欧赔" in txt or "欧指" in txt) and "html" in txt,
                                     "usable":("欧赔" in txt or "欧指" in txt) and "html" in txt})
                  elif key == "sporttery_direct":
                      j=json.loads(body)
                      result.update({"json_fields":sorted(j)[:10] if isinstance(j,dict) else [],"usable":bool(j) and isinstance(j,dict)})
                  else:
                      j=json.loads(body);now=datetime.datetime.now(datetime.timezone.utc)
                      ts=datetime.datetime.fromisoformat(j["last_updated_utc"].replace("Z","+00:00"))
                      age=int((now-ts).total_seconds())
                      matches=j.get("matches",[])
                      valid=[m for m in matches if all(str(m.get(k) or "").strip() for k in ("gameid","home","away","kickoff_cst","spf_win","spf_draw","spf_lost"))]
                      result.update({"total_matches":len(matches),"complete_spf_matches":len(valid),"age_seconds":age,
                                     "source_updated_at":j["last_updated_utc"],"usable":len(valid)>=5 and -300<=age<=7200})
                  all_results[key]=result
              except (HTTPError,URLError,ValueError,ET.ParseError,UnicodeError,KeyError,TimeoutError) as exc:
                  all_results[key]={"usable":False,"error":type(exc).__name__,"detail":str(exc)[:140]}
              print("SOURCE_PROBE "+key+" "+json.dumps(all_results[key],ensure_ascii=False),flush=True)
          print("SUMMARY "+json.dumps({"direct500":all_results["500_direct_xml"].get("usable",False),
                                       "directEuro":all_results["500_direct_euro"].get("usable",False),
                                       "directSporttery":all_results["sporttery_direct"].get("usable",False),
                                       "mirror500":all_results["500_github_mirror"].get("usable",False)},sort_keys=True))
          if not any(v.get("usable") for v in all_results.values()):
              raise SystemExit("ALL_CHINA_ODDS_SOURCES_UNAVAILABLE")
          PY
