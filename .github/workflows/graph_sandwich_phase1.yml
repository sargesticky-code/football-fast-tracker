name: Graph Sandwich Phase 1 Shadow Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_graph_sandwich_shadow.py'
      - 'tests/test_graph_sandwich_shadow.py'
      - 'data/hkjc_current.csv'
      - 'data/team_form_summary.csv'
      - 'data/hkjc_power_current.csv'
      - 'data/prediction_fallback_current.csv'
      - '.github/workflows/graph_sandwich_phase1.yml'
  workflow_dispatch:
  schedule:
    - cron: '45 * * * *'

permissions:
  contents: read

concurrency:
  group: graph-sandwich-phase1-shadow
  cancel-in-progress: true

jobs:
  build-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test runner only
        run: python -m pip install --disable-pip-version-check pytest==8.3.5
      - name: Run contract tests
        run: python -m pytest -q tests/test_graph_sandwich_shadow.py
      - name: Build lightweight relationship graph
        run: python scripts/build_graph_sandwich_shadow.py --output /tmp/graph_sandwich_shadow.json
      - name: Validate graph contract
        run: |
          python - <<'PY'
          import json
          g=json.load(open('/tmp/graph_sandwich_shadow.json'))
          assert g['schema']=='GS_SHADOW_V1'
          assert g['stats']['matches'] > 0
          assert g['stats']['edges'] >= g['stats']['matches']
          assert g['stats']['why_chains'] == g['stats']['matches']
          assert len(g['why_chains']) == g['stats']['matches']
          assert all('direction' in x and 'conflict' in x for x in g['why_chains'])
          print(g['stats'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: graph-sandwich-shadow
          path: /tmp/graph_sandwich_shadow.json
          retention-days: 3
