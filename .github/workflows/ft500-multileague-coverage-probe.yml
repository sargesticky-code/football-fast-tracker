name: FT500 one-shot multi-league coverage audit
on:
  push:
    branches: [probe/ft500-multileague-coverage-20261010]
    paths:
      - scripts/probe_500_multileague_coverage.py
      - scripts/capture_500_spf.py
      - tests/test_capture_500_spf.py
      - .github/workflows/ft500-multileague-coverage-probe.yml
permissions:
  contents: read
jobs:
  read-only:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Validate exact source and league mappings
        run: python -m unittest discover -s tests -p test_capture_500_spf.py -v
      - name: Verify official live five-league matches (no publication)
        run: python scripts/capture_500_spf.py
