name: FotMob H2H Enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: '50 22 * * *' # 06:50 Hong Kong time
    - cron: '50 10 * * *' # 18:50 Hong Kong time
  push:
    branches: [main]
    paths:
      - 'scripts/fotmob_h2h.py'
      - 'scripts/fotmob_h2h_worker.py'
      - 'scripts/build_h2h_summary.py'
      - 'data/fotmob_alias_master.csv'
      - '.github/workflows/fotmob_h2h.yml'

permissions:
  contents: write

concurrency:
  group: fotmob-h2h-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests==2.32.5
      - name: Build FotMob H2H
        env:
          FOTMOB_H2H_MAX_DETAILS: '50'
        run: |
          python scripts/fotmob_h2h_worker.py
          python scripts/build_h2h_summary.py
      - name: Validate
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          def rows(p):
              with open(p,encoding='utf-8-sig',newline='') as f:return list(csv.DictReader(f))
          fm=rows('data/fotmob_h2h_current.csv'); merged=rows('data/h2h_summary.csv')
          mapped=sum(r.get('mapping_status')=='VERIFIED' for r in fm)
          counts=Counter(r.get('quality') or 'UNKNOWN' for r in fm)
          used=sum((r.get('source') or '').startswith('FOTMOB') for r in merged)
          print(f'FOTMOB_H2H_VALID rows={len(fm)} mapped={mapped} quality={dict(counts)} merged_fotmob={used}')
          if not fm: raise SystemExit('empty FotMob H2H artifact')
          PY
      - name: Commit changed H2H state
        run: |
          git config user.name 'fast-tracker-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/fotmob_h2h_current.csv data/h2h_summary.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh FotMob H2H enrichment [skip ci]'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then exit 0; fi
            [ "$attempt" -eq 3 ] && exit 1
            sleep 2
          done
