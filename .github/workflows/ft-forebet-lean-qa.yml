name: FT Forebet Lean Release Gate
on:
  push:
    branches: [release/ft-forebet-lean-20261010]
    paths:
      - 'scripts/forebet_browser_source.py'
      - 'scripts/forebet_canonical_source_probe.py'
      - 'scripts/capture_forebet_canonical_light.py'
      - 'tests/test_capture_forebet_canonical_light.py'
      - '.github/workflows/ft-forebet-lean-qa.yml'
      - '.github/workflows/supabase_private_ingest.yml'
permissions:
  contents: read
concurrency:
  group: ft-forebet-lean-release-proof
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    services:
      browser-helper:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports: [8191:8191]
    steps:
      - uses: actions/checkout@v4
      - name: Install only required Forebet capture libraries
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.12.3 lxml==5.4.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Identity/time/model regression tests
        run: python -m unittest discover -s tests -p test_capture_forebet_canonical_light.py -v
      - name: Read one real source page and verify against live canonical fixtures
        env:
          LOCAL_BROWSER_HELPER: http://127.0.0.1:8191/v1
        run: python scripts/capture_forebet_canonical_light.py
      - name: Retain only read-only capture summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forebet-lean-proof
          path: /tmp/ft-forebet-verified-summary.json
          if-no-files-found: ignore
          retention-days: 3
