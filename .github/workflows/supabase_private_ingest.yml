name: Supabase Static Data Push

# Static/control-plane reconciliation only.
# Live capture is owned by Supabase cron + Edge Functions.
# Upstream workflow completions no longer fan out into extra ingest runs.

on:
  workflow_dispatch:
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase_private_ingest.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: supabase-private-data-push
  cancel-in-progress: true

jobs:
  push-current-artifacts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 60 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fast-tracker-supabase")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Build one static ingest batch
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          names = [
              "hkjc_current.csv",
              "forebet_current.csv",
              "model_current.csv",
              "team_alias_registry.csv",
              "form_current.csv",
              "odds_movement.csv",
              "prediction_fallback_current.csv",
              "bet365_current.csv",
              "forebet_supplement_current.csv",
              "forebet_availability.csv",
              "forebet_archive.csv",
              "evaluation_summary.csv",
              "hkjc_live_odds.csv",
              "hkjc_power_current.csv",
              "team_form_summary.csv",
              "match_scenario_current.csv",
          ]

          files = []
          for name in names:
              p = Path("data") / name
              if not p.exists():
                  continue
              files.append({
                  "path": f"data/{name}",
                  "content": p.read_text(encoding="utf-8-sig"),
              })

          Path("/tmp/fast-tracker-ingest-batch.json").write_text(
              json.dumps({"files": files}, ensure_ascii=False),
              encoding="utf-8",
          )
          print(f"BATCH files={len(files)} bytes={Path('/tmp/fast-tracker-ingest-batch.json').stat().st_size}")
          PY

      - name: Push static batch to Supabase private storage
        id: ingest
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fast-tracker-ingest-batch.json \
            "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/github-data-ingest" \
            -o /tmp/fast-tracker-ingest-response.json

          cat /tmp/fast-tracker-ingest-response.json
          changed="$(python - <<'PY'
          import json
          print(int(json.load(open("/tmp/fast-tracker-ingest-response.json", encoding="utf-8")).get("changed", 0)))
          PY
          )"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"

      - name: Refresh canonical core only when static inputs changed
        if: steps.ingest.outputs.changed != '0'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 120 \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"mode":"current"}' \
            "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/sync-fast-tracker"
          echo
