name: Supabase Private Ingest POC

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supabase_private_ingest.yml'

permissions:
  contents: read
  id-token: write

jobs:
  push-hkjc-current:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fast-tracker-supabase")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Push HKJC current artifact to Supabase
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          content = Path("data/hkjc_current.csv").read_text(encoding="utf-8-sig")
          Path("/tmp/fast-tracker-ingest.json").write_text(
              json.dumps({"path":"data/hkjc_current.csv","content":content}),
              encoding="utf-8",
          )
          PY
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/fast-tracker-ingest.json \
            "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/github-data-ingest"
