name: Supabase Static Data Push

# FT016: only Forebet canonical publication. Legacy CSV ingestion is retired.
on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Forebet Daily Feed"]
    types: [completed]
  schedule:
    - cron: '7,37 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase_private_ingest.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: forebet-canonical-publication
  cancel-in-progress: false

jobs:
  publish-forebet:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Test Forebet publisher contract
        run: python -m unittest discover -s tests -p 'test_forebet_canonical_batch.py' -v

      - name: Validate current Forebet model feed without scraping
        id: batch
        shell: bash
        run: |
          set -euo pipefail
          python scripts/forebet_canonical_batch.py
          python - <<'PY'
          import json,os
          b=json.load(open('/tmp/forebet-canonical-payload.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as output:
              output.write('has_models=' + ('true' if b['rows'] else 'false') + '\n')
              output.write('count=' + str(len(b['rows'])) + '\n')
          PY

      - name: Request existing GitHub OIDC identity
        if: steps.batch.outputs.has_models == 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL --retry 2 --retry-all-errors --retry-delay 2 --connect-timeout 10 --max-time 30 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fast-tracker-supabase")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Publish only verified Forebet models to canonical storage
        if: steps.batch.outputs.has_models == 'true'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 --retry-all-errors --retry-delay 2 \
            --connect-timeout 10 --max-time 30 \
            -X POST -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/forebet-canonical-payload.json \
            "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/forebet-canonical-publish" \
            -o /tmp/forebet-publish-result.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/forebet-publish-result.json'))
          if result.get('source')!='FOREBET' or not isinstance(result.get('accepted'),int):
              raise SystemExit('Publisher contract response invalid')
          print('FOREBET_CANONICAL_PUBLICATION',json.dumps(result,sort_keys=True))
          PY
