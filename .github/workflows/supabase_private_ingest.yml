name: Supabase Static Data Push

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data/**'
      - '.github/workflows/supabase_private_ingest.yml'
  schedule:
    - cron: '7,37 * * * *' # static artifact reconciliation only; no source scraping
  workflow_run:
    workflows:
      - "HKJC Live Market Feed"
      - "HKJC Live Odds 5min"
      - "Forebet Daily Feed"
      - "Football Shadow Models"
      - "Odds Movement Snapshot"
      - "Prediction fallback refresh"
      - "Bet365 HKJC Benchmark"
      - "Forebet supplement refresh"
      - "Prediction Archive and Evaluation"
      - "Match Scenario Features"
    types: [completed]

permissions:
  contents: read
  id-token: write

concurrency:
  group: supabase-private-data-push
  cancel-in-progress: false

jobs:
  push-current-artifacts:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event_name == 'push' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fast-tracker-supabase")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Push current artifacts to Supabase private storage
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          files=(
            data/hkjc_current.csv
            data/forebet_current.csv
            data/model_current.csv
            data/team_alias_registry.csv
            data/form_current.csv
            data/odds_movement.csv
            data/prediction_fallback_current.csv
            data/bet365_current.csv
            data/forebet_supplement_current.csv
            data/forebet_availability.csv
            data/forebet_archive.csv
            data/evaluation_summary.csv
            data/hkjc_live_odds.csv
            data/hkjc_power_current.csv
            data/team_form_summary.csv
            data/match_scenario_current.csv
          )

          for file in "${files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "SKIP missing $file"
              continue
            fi

            FILE="$file" python - <<'PY'
          import json, os
          from pathlib import Path
          path = os.environ["FILE"]
          content = Path(path).read_text(encoding="utf-8-sig")
          Path("/tmp/fast-tracker-ingest.json").write_text(
              json.dumps({"path": path, "content": content}),
              encoding="utf-8",
          )
          PY

            echo "PUSH $file"
            if ! curl -fsSL \
              -X POST \
              -H "Authorization: Bearer $OIDC_TOKEN" \
              -H "Content-Type: application/json" \
              --data-binary @/tmp/fast-tracker-ingest.json \
              "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/github-data-ingest"; then
              if [ "$file" = "data/match_scenario_current.csv" ]; then
                echo "::warning::Optional scenario ingest failed; continuing canonical refresh"
                continue
              fi
              exit 1
            fi
            echo
          done

      - name: Refresh Supabase canonical core once
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"mode":"current"}' \
            "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/sync-fast-tracker"
          echo

      - name: Refresh live score layer after HKJC live cycle
        if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.name == 'HKJC Live Odds 5min'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"mode":"live"}' \
            "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/sync-fast-tracker"
          echo
