name: Forebet V2 - Verified Flashscore Daily Capture
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - feat/forebet-v2-20261014
    paths:
      - 'scripts/forebet_v2.py'
      - 'scripts/forebet_browser_source.py'
      - 'tests/test_forebet_v2.py'
      - 'supabase/functions/forebet-canonical-publish/index.ts'
      - '.github/workflows/supabase_private_ingest.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: forebet-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      browser-helper:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports: [8191:8191]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.12.3 lxml==5.4.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test rebuilt Forebet V2 identity contract
        run: python -m unittest discover -s tests -p test_forebet_v2.py -v
      - name: Obtain scoped GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL --connect-timeout 10 --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=fast-tracker-supabase")"
          token="$(python -c 'import json,sys;print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Capture one source page and match only verified DB Flashscore
        id: capture
        env:
          FOREBET_FIXTURES_OIDC: ${{ steps.oidc.outputs.token }}
          LOCAL_BROWSER_HELPER: http://127.0.0.1:8191/v1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/forebet_v2.py
          python - <<'PY'
          import json,os
          batch=json.load(open("/tmp/ft-forebet-verified-only.json"))
          proof=json.load(open("/tmp/ft-forebet-verified-summary.json"))
          rows=batch["rows"]
          assert batch["source"]=="FOREBET"
          assert 1 <= len(rows) <= 80
          assert proof["canonical_source"]=="VERIFIED_FLASHSCORE_DB"
          assert all(r["match_id"].startswith("FS:") for r in rows)
          assert all(r["source_display_offset_minutes"]==0 for r in rows)
          assert len({r["match_id"] for r in rows})==len(rows)
          with open(os.environ["GITHUB_OUTPUT"],"a") as fd:
              fd.write("count="+str(len(rows))+"\n")
          print("FOREBET_V2_MATCHES",len(rows),"SOURCE_ROWS",proof["source_rows_parsed"])
          PY
      - name: Publish only on main via unchanged OIDC service gate
        if: github.ref == 'refs/heads/main' && steps.capture.outputs.count != '0'
        env:
          FOREBET_OIDC: ${{ steps.oidc.outputs.token }}
          EXPECTED: ${{ steps.capture.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 10 --max-time 30 \
            -X POST -H "Authorization: Bearer $FOREBET_OIDC" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/ft-forebet-verified-only.json \
            'https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/forebet-canonical-publish' \
            -o /tmp/ft-forebet-publish-result.json
          python - <<'PY'
          import json,os
          r=json.load(open("/tmp/ft-forebet-publish-result.json"))
          if (r.get("source")!="FOREBET" or r.get("accepted")!=int(os.environ["EXPECTED"]) or r.get("applied",0)<1):
              raise SystemExit("FOREBET_V2_PUBLICATION_NOT_CONFIRMED")
          print("FOREBET_V2_PUBLISHED",r["accepted"],"APPLIED",r["applied"])
          PY
      - name: Preserve only bounded proof summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forebet-v2-summary
          path: /tmp/ft-forebet-verified-summary.json
          if-no-files-found: ignore
          retention-days: 3
