name: Forebet V2 - Verified Flashscore Daily Capture
on:
  schedule:
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
      - feat/forebet-v2-20261014
    paths:
      - 'scripts/forebet_v2.py'
      - 'scripts/forebet_market_capture_v2.py'
      - 'scripts/forebet_provisional.py'
      - 'scripts/forebet_browser_source.py'
      - 'tests/test_forebet_v2.py'
      - 'supabase/functions/forebet-canonical-publish/index.ts'
      - '.github/workflows/supabase_private_ingest.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: forebet-v2-${{ github.ref }}
  cancel-in-progress: false
jobs:
  source-and-match:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      browser-helper:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports: [8191:8191]
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned dependencies
        run: |
          python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.12.3 lxml==5.4.0 playwright==1.55.0
          python -m playwright install --with-deps chromium
      - name: Test rebuilt Forebet V2 identity contract
        run: python -m unittest discover -s tests -p test_forebet_v2.py -v
      - name: Verify independent Forebet market parsing safely
        run: python -m unittest discover -s tests -p test_forebet_market_capture_v2.py -v
      - name: Obtain scoped GitHub OIDC identity
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL --connect-timeout 10 --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=fast-tracker-supabase")"
          token="$(python -c 'import json,sys;print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Capture bounded UTC date pages and match only verified DB Flashscore
        id: capture
        env:
          FOREBET_FIXTURES_OIDC: ${{ steps.oidc.outputs.token }}
          LOCAL_BROWSER_HELPER: http://127.0.0.1:8191/v1
        shell: bash
        run: |
          set -euo pipefail
          python scripts/forebet_v2.py
          python - <<'PY'
          import json,os
          batch=json.load(open("/tmp/ft-forebet-verified-only.json"))
          proof=json.load(open("/tmp/ft-forebet-verified-summary.json"))
          rows=batch["rows"]
          assert batch["source"]=="FOREBET"
          assert 1 <= len(rows) <= 300
          assert 1 <= proof['pages_attempted'] <= 3
          assert 0 <= proof['market_pages_attempted'] <= 6
          assert proof['market_pages_attempted']==len(proof['market_pages_successful'])+len(proof['market_pages_failed'])
          assert all(0 <= proof['market_coverage'][m] <= len(rows) for m in ('ou25','corners95'))
          assert proof['pages_successful'] >= 1
          assert proof['pages_successful'] + len(proof['pages_failed']) == proof['pages_attempted']
          assert proof["canonical_source"]=="VERIFIED_FLASHSCORE_DB"
          assert all(r["match_id"].startswith("FS:") for r in rows)
          assert all(r["source_display_offset_minutes"]==0 for r in rows)
          assert len({r["match_id"] for r in rows})==len(rows)
          with open(os.environ["GITHUB_OUTPUT"],"a") as fd:
              fd.write("count="+str(len(rows))+"\n")
          print("FOREBET_V2_MATCHES",len(rows),"SOURCE_ROWS",proof["source_rows_parsed"],"PAGES",proof["pages_successful"],"OF",proof["pages_attempted"])
          print("FOREBET_VERIFIED_MARKETS",proof['market_coverage'],"PAGES",proof['market_pages_attempted'],"FAILED",len(proof['market_pages_failed']))
          if proof['market_pages_failed']:
              print("::warning::Forebet market pages unavailable or incomplete. Missing O/U/corner fields remain UNKNOWN; 1X2 publication unaffected.")
          if proof["partial_source_coverage"]:
              print("::warning::Some Forebet dates unavailable; publishing verified subset only.")
          if any(p["capture_mode"] != "full_page" for p in proof["page_details"]):
              print("::warning::Some Forebet pages exceeded full-row HTML budget; allowlist fallback used.")
          PY
      - name: Publish only on main via unchanged OIDC service gate
        if: github.ref == 'refs/heads/main' && steps.capture.outputs.count != '0'
        env:
          FOREBET_OIDC: ${{ steps.oidc.outputs.token }}
          EXPECTED: ${{ steps.capture.outputs.count }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 10 --max-time 30 \
            -X POST -H "Authorization: Bearer $FOREBET_OIDC" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/ft-forebet-verified-only.json \
            'https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/forebet-canonical-publish' \
            -o /tmp/ft-forebet-publish-result.json
          python - <<'PY'
          import json,os
          r=json.load(open("/tmp/ft-forebet-publish-result.json"))
          if (r.get("source")!="FOREBET" or r.get("accepted")!=int(os.environ["EXPECTED"]) or r.get("applied",0)<1):
              raise SystemExit("FOREBET_V2_PUBLICATION_NOT_CONFIRMED")
          print("FOREBET_V2_PUBLISHED",r["accepted"],"APPLIED",r["applied"])
          PY
      - name: Validate bounded one-team provisional reconciliation
        shell: bash
        run: |
          python - <<'PY'
          import json
          p=json.load(open("/tmp/ft-forebet-provisional-only.json"))
          strict=json.load(open("/tmp/ft-forebet-verified-only.json"))["rows"]
          rows=p["rows"]
          assert p["source"]=="FOREBET_PROVISIONAL_RECONCILE_V1"
          assert len(rows)<=180 and len(p["complete_dates"])<=3
          assert len(p["verified_ids"])==len(strict)
          assert {r["match_id"] for r in strict}==set(p["verified_ids"])
          assert not ({r["match_id"] for r in strict}&{r["match_id"] for r in rows})
          assert len({r["match_id"] for r in rows})==len(rows)
          assert len({r["source_url"] for r in rows})==len(rows)
          assert all(
             (r["matched_identity"]=="ONE_SIDE_WITH_CONFIRMED_COMPETITION_AND_UNIQUE_KICKOFF"
               and r["one_verified_side"] in ("HOME","AWAY")) or
             (r["matched_identity"]=="BOTH_NAME_SIMILARITY_030_STRONG_SIDE_070_LEAGUE_EXACT_TIME_UNIQUE"
               and r["one_verified_side"]=="SIMILARITY"
               and min(r["home_similarity"],r["away_similarity"])>=.30
               and max(r["home_similarity"],r["away_similarity"])>=.70)
             for r in rows)
          print("FOREBET_LOW_SIMILARITY_CANDIDATES",
                sum(r["one_verified_side"]=="SIMILARITY" for r in rows))
          print("FOREBET_PROVISIONAL_PROOF",len(rows),"STRICT",len(strict))
          PY
      - name: Reconcile provisional candidates with disconnect-on-conflict
        if: github.ref == 'refs/heads/main' && steps.capture.outputs.count != '0'
        env:
          FOREBET_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 10 --max-time 30 \
            -X POST -H "Authorization: Bearer $FOREBET_OIDC" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/ft-forebet-provisional-only.json \
            'https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/forebet-canonical-publish' \
            -o /tmp/ft-forebet-provisional-result.json
          python - <<'PY'
          import json
          r=json.load(open("/tmp/ft-forebet-provisional-result.json"))
          if r.get("source")!="FOREBET_PROVISIONAL" or r.get("run") is None:
              raise SystemExit("FOREBET_PROVISIONAL_RECONCILIATION_NOT_CONFIRMED")
          print("FOREBET_PROVISIONAL_RECONCILED",
                r.get("currently_provisional"),"NEW",r.get("admitted_new"),
                "DISCONNECTED",r.get("disconnected"),"PROMOTED",r.get("promoted"))
          PY
      - name: Preserve only bounded proof summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forebet-v2-summary
          path: /tmp/ft-forebet-verified-summary.json
          if-no-files-found: ignore
          retention-days: 3
