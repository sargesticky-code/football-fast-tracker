name: Forebet V2 source identity contract QA
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/capture_forebet_canonical_light.py'
      - 'scripts/forebet_v2.py'
      - 'scripts/forebet_browser_source.py'
      - 'tests/test_forebet_browser_source_large_market.py'
      - 'scripts/forebet_market_capture_v2.py'
      - 'tests/test_forebet_market_capture_v2.py'
      - 'scripts/forebet_verified_aliases.py'
      - 'tests/test_forebet_v2.py'
      - '.github/workflows/forebet-v2-contract-qa.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/capture_forebet_canonical_light.py'
      - 'scripts/forebet_v2.py'
      - 'scripts/forebet_browser_source.py'
      - 'tests/test_forebet_browser_source_large_market.py'
      - 'scripts/forebet_market_capture_v2.py'
      - 'tests/test_forebet_market_capture_v2.py'
      - 'scripts/forebet_verified_aliases.py'
      - 'tests/test_forebet_v2.py'
      - '.github/workflows/forebet-v2-contract-qa.yml'
permissions:
  contents: read
jobs:
  offline-identity-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Pinned offline parser prerequisites
        run: python -m pip install requests==2.32.5 beautifulsoup4==4.12.3 lxml==5.4.0 playwright==1.55.0
      - name: Validate canonical match identity, source leagues and safety
        run: python -m unittest discover -s tests -p test_forebet_v2.py -v
      - name: Validate independent source markets and exact-match safeguards
        run: python -m unittest discover -s tests -p test_forebet_market_capture_v2.py -v
      - name: Validate bounded large corner-page capture and explicit failure reasons
        run: python -m unittest discover -s tests -p test_forebet_browser_source_large_market.py -v
