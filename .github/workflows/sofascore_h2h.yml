name: SofaScore H2H Enrichment

on:
  workflow_dispatch:
  schedule:
    - cron: '55 22 * * *' # 06:55 Hong Kong time
    - cron: '55 10 * * *' # 18:55 Hong Kong time
  push:
    branches: [main]
    paths:
      - 'scripts/sofascore_h2h.py'
      - 'scripts/sofascore_h2h_worker.py'
      - 'scripts/build_h2h_summary.py'
      - '.github/workflows/sofascore_h2h.yml'

permissions:
  contents: write

concurrency:
  group: sofascore-h2h-enrichment
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout current state
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build bounded SofaScore H2H enrichment
        env:
          SOFASCORE_H2H_MAX_EVENTS: '30'
        run: |
          python scripts/sofascore_h2h_worker.py
          python scripts/build_h2h_summary.py

      - name: Validate enrichment artifacts
        run: |
          python - <<'PY'
          import csv
          from collections import Counter
          from pathlib import Path

          def rows(path):
              p=Path(path)
              if not p.exists():
                  raise SystemExit(f'missing {path}')
              with p.open(encoding='utf-8-sig', newline='') as fh:
                  data=list(csv.DictReader(fh))
              if not data:
                  raise SystemExit(f'empty {path}')
              return data

          sofa=rows('data/sofascore_h2h_current.csv')
          merged=rows('data/h2h_summary.csv')
          counts=Counter(r.get('quality') or 'UNKNOWN' for r in sofa)
          mapped=sum((r.get('mapping_status') or '') == 'VERIFIED' for r in sofa)
          used=sum((r.get('source') or '').startswith('SOFASCORE') for r in merged)
          print(
              f'SOFASCORE_H2H_VALID rows={len(sofa)} mapped={mapped} '
              f'quality={dict(counts)} merged_sofascore={used}'
          )
          PY

      - name: Commit changed SofaScore H2H state
        run: |
          git config user.name 'fast-tracker-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/sofascore_h2h_current.csv data/h2h_summary.csv
          if git diff --cached --quiet; then
            echo 'No SofaScore H2H changes to commit.'
            exit 0
          fi
          git commit -m 'Refresh SofaScore H2H enrichment [skip ci]'
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push; then
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo 'SofaScore H2H publish failed after retries.' >&2
              exit 1
            fi
            sleep 2
          done
