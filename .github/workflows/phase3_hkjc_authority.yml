name: Phase 3 HKJC Authority

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    branches: [phase3-live-intelligence]
    paths:
      - 'phase3/**'
      - 'scripts/phase3_capture_hkjc_authority.py'
      - 'scripts/phase3_check_hkjc_authority.py'
      - 'scripts/phase3_collect_fotmob_identity.py'
      - 'scripts/phase3_build_identity_registry.py'
      - 'tests/test_phase3_*.py'
      - '.github/workflows/phase3_hkjc_authority.yml'
permissions:
  contents: read
concurrency:
  group: phase3-hkjc-authority-${{ github.ref }}
  cancel-in-progress: true
jobs:
  authority:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HKJC_UPSTREAM_SHA: '1d2234102dc8f1ee23d0b45c25c125dc3ef98176'
      HKJC_SCRAPER_PATH: '/tmp/hkjc-phase3'
    steps:
      - name: Checkout Phase 3 ref
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore persistent Layer 2 identity state
        id: identity-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/phase3_identity_evidence.jsonl
            data/phase3_live_identity_map.json
            data/phase3_identity_source_health.json
            data/phase3_identity_exceptions.json
          key: phase3-identity-${{ github.run_id }}
          restore-keys: |
            phase3-identity-
      - name: Diagnose Layer 2 state continuity
        run: |
          echo "PHASE3_IDENTITY_CACHE hit=${{ steps.identity-cache.outputs.cache-hit }} matched_key=${{ steps.identity-cache.outputs.cache-matched-key }}"
          python - <<'PY'
          from pathlib import Path
          for name in (
              'phase3_identity_evidence.jsonl',
              'phase3_live_identity_map.json',
              'phase3_identity_source_health.json',
              'phase3_identity_exceptions.json',
          ):
              p=Path('data')/name
              print(f"PHASE3_IDENTITY_STATE file={name} present={int(p.exists())} bytes={p.stat().st_size if p.exists() else 0}")
          PY
      - name: Snapshot Layer 2 registry before cycle
        run: |
          cp data/phase3_live_identity_map.json /tmp/phase3_identity_before.json 2>/dev/null || echo '[]' > /tmp/phase3_identity_before.json
      - name: Run Layer 1 deterministic tests
        run: python -m unittest tests.test_phase3_hkjc_authority -v
      - name: Run Layer 2 identity tests
        run: |
          python -m unittest tests.test_phase3_identity_registry -v
          python -m unittest tests.test_phase3_external_identity -v
          python -m unittest tests.test_phase3_layer2_authority_gate -v
          python -m unittest tests.test_phase3_sofascore_identity -v
          python -m unittest tests.test_phase3_sofascore_transport -v
          python -m unittest tests.test_phase3_source_health -v
          python -m unittest tests.test_phase3_espn_identity -v
          python -m unittest tests.test_phase3_identity_exceptions -v
          python -m unittest tests.test_phase3_state_continuity -v
      - name: Checkout pinned HKJC scraper
        run: |
          rm -rf "$HKJC_SCRAPER_PATH"
          git clone --filter=blob:none --no-checkout https://github.com/sososo829/hkjc-football-scraper.git "$HKJC_SCRAPER_PATH"
          git -C "$HKJC_SCRAPER_PATH" fetch --depth 1 origin "$HKJC_UPSTREAM_SHA"
          git -C "$HKJC_SCRAPER_PATH" checkout --detach "$HKJC_UPSTREAM_SHA"
      - name: Capture one-request HKJC authority snapshot
        run: python scripts/phase3_capture_hkjc_authority.py
      - name: Evaluate Phase 3 Layer 1 authority
        run: PYTHONPATH=. python scripts/phase3_check_hkjc_authority.py
      - name: Collect external identity evidence
        run: PYTHONPATH=. python scripts/phase3_collect_fotmob_identity.py
      - name: Build persistent identity registry
        run: PYTHONPATH=. python scripts/phase3_build_identity_registry.py
      - name: Enforce Layer 2 runtime continuity
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from phase3.state_continuity import assert_empty_cycle_retention, registry_fingerprint
          before_rows = json.loads(Path('/tmp/phase3_identity_before.json').read_text())
          p = Path('data/phase3_live_identity_map.json')
          after_rows = json.loads(p.read_text()) if p.exists() else []
          before = registry_fingerprint(before_rows)
          after = registry_fingerprint(after_rows)
          assert_empty_cycle_retention(before, after)
          print(f"PHASE3_IDENTITY_CONTINUITY verified={len(after['verified'])} candidate={len(after['candidates'])} status=PASS")
          PY
      - name: Save persistent Layer 2 identity state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/phase3_identity_evidence.jsonl
            data/phase3_live_identity_map.json
            data/phase3_identity_source_health.json
            data/phase3_identity_exceptions.json
          key: phase3-identity-${{ github.run_id }}
      - name: Upload Phase 3 evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase3-live-evidence-${{ github.run_id }}
          path: |
            data/phase3_hkjc_authority.json
            data/phase3_identity_evidence.jsonl
            data/phase3_live_identity_map.json
            data/phase3_identity_source_health.json
            data/phase3_identity_exceptions.json
          if-no-files-found: warn
          retention-days: 7
