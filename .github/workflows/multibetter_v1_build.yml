name: Multibetter V1 Current Intake + Build
# launcher revision: 15 · tolerant Statarea clock calibration

on:
  workflow_dispatch:
  schedule:
    # Two target-aware builds per day, after the 06:30 / 18:30 HKJC authority cycles.
    - cron: '10 23 * * *' # 07:10 Asia/Hong_Kong
    - cron: '10 11 * * *' # 19:10 Asia/Hong_Kong
  push:
    branches:
      - main
    paths:
      - '.github/workflows/multibetter_v1_build.yml'
# Phase 1 recovery heartbeat 2026-09-20

permissions:
  contents: write
  id-token: write

concurrency:
  group: multibetter-v1-current
  cancel-in-progress: true

jobs:
  current:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Multibetter branch
        uses: actions/checkout@v4
        with:
          ref: multibetter-v1
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: multibetter/pyproject.toml

      - name: Install Multibetter
        run: python -m pip install -e "multibetter[dev]"

      - name: Run regression tests
        run: pytest -q multibetter/tests

      - name: Read latest production Forebet feeds from main
        run: |
          git fetch origin main
          git show origin/main:data/forebet_current.csv > /tmp/forebet_current.csv
          git show origin/main:data/hkjc_targets.csv > /tmp/hkjc_targets_static.csv
          if git cat-file -e origin/main:data/forebet_supplement_current.csv 2>/dev/null; then
            git show origin/main:data/forebet_supplement_current.csv > /tmp/forebet_supplement_current.csv
          else
            printf '' > /tmp/forebet_supplement_current.csv
          fi

      - name: Build fresh HKJC target universe from Supabase authority
        shell: bash
        run: |
          set -euo pipefail
          if curl -fsSL --max-time 30             "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/app-phase1-feed?hours=48"             -o /tmp/hkjc_authority.json; then
            python - <<'PY'
          import csv, json
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          source = Path("/tmp/hkjc_authority.json")
          out = Path("/tmp/hkjc_targets.csv")
          body = json.loads(source.read_text(encoding="utf-8"))
          matches = body.get("matches") or []
          rows = []
          now = datetime.now(timezone.utc)
          hkt = ZoneInfo("Asia/Hong_Kong")

          for m in matches:
              if m.get("liveNow"):
                  continue
              event_id = str(m.get("id") or "").strip()
              home = str(m.get("home") or "").strip()
              away = str(m.get("away") or "").strip()
              kickoff_raw = str(m.get("kickoff") or "").strip()
              if not event_id or not home or not away or not kickoff_raw:
                  continue
              try:
                  kickoff = datetime.fromisoformat(kickoff_raw.replace("Z","+00:00"))
              except ValueError:
                  continue
              if kickoff.tzinfo is None:
                  kickoff = kickoff.replace(tzinfo=timezone.utc)
              kickoff_utc = kickoff.astimezone(timezone.utc)
              if kickoff_utc <= now:
                  continue
              kickoff_hkt = kickoff_utc.astimezone(hkt)

              odds = m.get("odds") or {}
              rows.append({
                  "fetched_at_hkt": body.get("generatedAt") or "",
                  "match_date": kickoff_hkt.date().isoformat(),
                  # Multibetter's HKJC adapter contract is intentionally
                  # timezone-naive HKT. Its parser then converts HKT -> UTC.
                  "kickoff_hkt": kickoff_hkt.strftime("%Y-%m-%d %H:%M"),
                  "hkjc_event_id": event_id,
                  "league_zh": str(m.get("league") or "").strip(),
                  "home_zh": str(m.get("homeZh") or "").strip(),
                  "away_zh": str(m.get("awayZh") or "").strip(),
                  "home_en": home,
                  "away_en": away,
                  "had_home": odds.get("home") if odds.get("home") is not None else "",
                  "had_draw": odds.get("draw") if odds.get("draw") is not None else "",
                  "had_away": odds.get("away") if odds.get("away") is not None else "",
                  "mapping_source": "SUPABASE_HKJC_AUTHORITY",
                  "forebet_state": "",
                  "forebet_reason": "",
                  "forebet_checked_at": "",
              })

          if not rows:
              raise SystemExit("Supabase HKJC authority returned zero future targets")

          fields = [
              "fetched_at_hkt","match_date","kickoff_hkt","hkjc_event_id","league_zh",
              "home_zh","away_zh","home_en","away_en","had_home","had_draw","had_away",
              "mapping_source","forebet_state","forebet_reason","forebet_checked_at",
          ]
          with out.open("w",encoding="utf-8-sig",newline="") as fh:
              w=csv.DictWriter(fh,fieldnames=fields)
              w.writeheader()
              w.writerows(rows)
          print(f"HKJC_MULTISOURCE_AUTHORITY source=supabase rows={len(rows)}")
          PY
          else
            echo "::warning::Supabase HKJC authority feed unavailable; using main-branch static fallback"
            cp /tmp/hkjc_targets_static.csv /tmp/hkjc_targets.csv
          fi

          python - <<'PY'
          import csv
          from pathlib import Path
          p=Path("/tmp/hkjc_targets.csv")
          with p.open(encoding="utf-8-sig",newline="") as fh:
              rows=list(csv.DictReader(fh))
          if not rows:
              raise SystemExit("HKJC Multibetter target universe is empty")
          required={"hkjc_event_id","kickoff_hkt","home_en","away_en"}
          if not required.issubset(rows[0]):
              raise SystemExit("HKJC Multibetter target schema incomplete")
          ids=[str(r.get("hkjc_event_id") or "").strip() for r in rows]
          if any(not x for x in ids) or len(ids)!=len(set(ids)):
              raise SystemExit("HKJC Multibetter target IDs missing or duplicated")
          print(f"HKJC_MULTISOURCE_TARGET_VALIDATED rows={len(rows)}")
          PY

      - name: Build HKJC Multibetter target anchors
        run: |
          python - <<'PY'
          import csv
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          src = Path("/tmp/hkjc_targets.csv")
          out = Path("/tmp/multisource_hkjc_anchors.csv")
          rows = []
          with src.open("r", encoding="utf-8-sig", newline="") as fh:
              for r in csv.DictReader(fh):
                  event_id = (r.get("hkjc_event_id") or "").strip()
                  home = (r.get("home_en") or "").strip()
                  away = (r.get("away_en") or "").strip()
                  raw = (r.get("kickoff_hkt") or "").strip()
                  if not event_id or not home or not away or not raw:
                      continue
                  try:
                      dt = datetime.fromisoformat(raw)
                  except ValueError:
                      continue
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone(timedelta(hours=8)))
                  utc = dt.astimezone(timezone.utc)
                  rows.append({
                      "DATE": utc.strftime("%d/%m/%Y"),
                      "TIME": utc.strftime("%H:%M"),
                      "HOME TEAM": home,
                      "AWAY TEAM": away,
                  })
          with out.open("w", encoding="utf-8", newline="") as fh:
              w = csv.DictWriter(fh, fieldnames=["DATE","TIME","HOME TEAM","AWAY TEAM"])
              w.writeheader()
              w.writerows(rows)
          print("HKJC_MULTISOURCE_TARGETS", len(rows))
          if not rows:
              raise SystemExit("HKJC target universe is empty")
          PY

      - name: Collect FRB anchor
        run: |
          python -m multibetter.scripts.collect_source \
            --source FRB \
            --days 2 \
            --max-seconds 45 \
            --our-forebet /tmp/forebet_current.csv \
            --our-forebet-supplement /tmp/forebet_supplement_current.csv

      - name: Collect ACC
        run: python -m multibetter.scripts.collect_source --source ACC --days 2 --max-seconds 180 --anchor-file /tmp/multisource_hkjc_anchors.csv

      - name: Collect BCL
        run: python -m multibetter.scripts.collect_source --source BCL --days 2 --max-seconds 120 --anchor-file /tmp/multisource_hkjc_anchors.csv

      - name: Collect FST
        run: python -m multibetter.scripts.collect_source --source FST --days 2 --max-seconds 60

      - name: Collect PRE
        run: python -m multibetter.scripts.collect_source --source PRE --days 2 --max-seconds 60

      - name: Build fresh UTC anchors for Statarea clock
        run: |
          python - <<'PY'
          import csv
          import json
          from datetime import datetime, timezone, timedelta
          from pathlib import Path

          out = Path("/tmp/statarea_calibration_anchors.csv")
          rows = []
          seen = set()

          def add(date_text, time_text, home, away, source):
              date_text = str(date_text or "").strip()
              time_text = str(time_text or "").strip()
              home = str(home or "").strip()
              away = str(away or "").strip()
              if not date_text or not time_text or not home or not away:
                  return
              key = (date_text, time_text, home.casefold(), away.casefold())
              if key in seen:
                  return
              seen.add(key)
              rows.append({
                  "DATE": date_text,
                  "TIME": time_text,
                  "HOME TEAM": home,
                  "AWAY TEAM": away,
                  "ANCHOR_SOURCE": source,
              })

          # Primary authority anchors: HKJC HKT -> UTC.
          hkjc = Path("/tmp/hkjc_targets.csv")
          with hkjc.open("r", encoding="utf-8-sig", newline="") as fh:
              for r in csv.DictReader(fh):
                  home = (r.get("home_en") or "").strip()
                  away = (r.get("away_en") or "").strip()
                  raw = (r.get("kickoff_hkt") or "").strip()
                  if not home or not away or not raw:
                      continue
                  try:
                      dt = datetime.fromisoformat(raw)
                  except ValueError:
                      continue
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone(timedelta(hours=8)))
                  utc = dt.astimezone(timezone.utc)
                  add(
                      utc.strftime("%d/%m/%Y"),
                      utc.strftime("%H:%M"),
                      home,
                      away,
                      "HKJC",
                  )

          # Calibration support only: fresh independent source rows already
          # normalized to UTC by their collectors. These do NOT create HKJC
          # matches or bypass identity matching; Statarea still requires an
          # exact oriented team pair before a clock sample is accepted.
          source_files = {
              "ACC": "accumulator.csv",
              "BCL": "betclan.csv",
              "FST": "footballsupertips.csv",
              "PRE": "prematips.csv",
          }
          counts = {"HKJC": sum(1 for r in rows if r["ANCHOR_SOURCE"] == "HKJC")}
          for source, filename in source_files.items():
              health_path = Path("multibetter/incoming/health") / f"{source.lower()}.json"
              data_path = Path("multibetter/incoming/current") / filename
              if not health_path.exists() or not data_path.exists():
                  counts[source] = 0
                  continue
              try:
                  health = json.loads(health_path.read_text(encoding="utf-8"))
              except Exception:
                  counts[source] = 0
                  continue
              if health.get("status") != "OK":
                  counts[source] = 0
                  continue
              before = len(rows)
              with data_path.open("r", encoding="utf-8-sig", newline="") as fh:
                  for r in csv.DictReader(fh):
                      add(
                          r.get("DATE"),
                          r.get("TIME"),
                          r.get("HOME TEAM"),
                          r.get("AWAY TEAM"),
                          source,
                      )
              counts[source] = len(rows) - before

          with out.open("w", encoding="utf-8", newline="") as fh:
              w = csv.DictWriter(
                  fh,
                  fieldnames=["DATE","TIME","HOME TEAM","AWAY TEAM","ANCHOR_SOURCE"],
              )
              w.writeheader()
              w.writerows(rows)

          print("STA_CALIBRATION_ANCHORS", len(rows), counts)
          if not rows:
              raise SystemExit("Statarea calibration anchor universe is empty")
          PY

      - name: Collect STA
        run: python -m multibetter.scripts.collect_source --source STA --days 2 --max-seconds 60 --anchor-file /tmp/statarea_calibration_anchors.csv

      - name: Summarize intake health
        run: |
          python -m multibetter.scripts.summarize_intake \
            --health-dir multibetter/incoming/health

      - name: Load verified universal team master
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/team-master
          for source in GLOBAL FRB ACC BCL FST PRE STA; do
            curl -fsSL               "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/team-name-master?source=$source"               -o "/tmp/team-master/$source.json"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          for path in sorted(Path("/tmp/team-master").glob("*.json")):
              body=json.loads(path.read_text(encoding="utf-8"))
              if not body.get("ok"):
                  raise SystemExit(f"team master load failed: {path.name}")
              print(path.stem, "verified", body.get("count",0), "blocked", len(body.get("blockedNames",[])))
          PY

      - name: Build Multibetter current output
        run: |
          python -m multibetter.scripts.build_current \
            --source-dir multibetter/incoming/current \
            --health-dir multibetter/incoming/health \
            --team-master-dir /tmp/team-master \
            --our-forebet /tmp/forebet_current.csv \
            --hkjc-targets /tmp/hkjc_targets.csv \
            --alias-cache multibetter/data/forebet_bridge_aliases.csv \
            --output multibetter/data/multibetter_current.csv \
            --health-output multibetter/data/multibetter_current_health.json

      - name: Alias health
        run: |
          python multibetter/scripts/alias_health_report.py \
            --root . \
            --output multibetter/data/alias_health.json

      - name: Validate fresh-source coverage
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          health = json.loads(
              Path("multibetter/incoming/health/summary.json").read_text()
          )
          sources = health["sources"]
          optional_ok = [
              key for key in ("ACC", "BCL", "FST", "PRE", "STA")
              if sources.get(key, {}).get("status") == "OK"
          ]
          print("FRESH_OPTIONAL_SOURCES", optional_ok)
          if len(optional_ok) < 2:
              raise SystemExit(
                  "Fewer than two optional prediction sources are fresh; "
                  "do not publish a degraded Multibetter build."
              )
          if sources.get("FRB", {}).get("status") != "OK":
              print("::warning::Forebet evidence is unavailable; continuing with HKJC authority + optional sources.")
          PY

      - name: Request GitHub OIDC token for Supabase
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fast-tracker-supabase")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Push Multibetter current to Supabase
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          content = Path("multibetter/data/multibetter_current.csv").read_text(encoding="utf-8-sig")
          Path("/tmp/multibetter-ingest.json").write_text(
              json.dumps({"path":"data/multibetter_current.csv","content":content}),
              encoding="utf-8",
          )
          PY

          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/multibetter-ingest.json \
            "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/github-data-ingest"
          echo

          curl -fsSL \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"mode":"current"}' \
            "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/sync-fast-tracker"
          echo

      - name: Commit Multibetter intake and outputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            multibetter/incoming/current \
            multibetter/incoming/health \
            multibetter/data/multibetter_current.csv \
            multibetter/data/multibetter_current_health.json \
            multibetter/data/forebet_bridge_aliases.csv \
            multibetter/data/alias_health.json

          if git diff --cached --quiet; then
            echo "No Multibetter current changes."
            exit 0
          fi

          git commit -m "Update Multibetter current intake and output [skip ci]"

          for attempt in 1 2 3 4; do
            git pull --rebase origin multibetter-v1
            if git push origin HEAD:multibetter-v1; then
              exit 0
            fi
            if [ "$attempt" -eq 4 ]; then
              echo "Multibetter push failed after retries." >&2
              exit 1
            fi
            sleep 2
          done
