name: SofaScore H2H Adapter Tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/sofascore_h2h.py'
      - 'tests/test_sofascore_h2h.py'
      - '.github/workflows/sofascore_h2h_tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m unittest tests.test_sofascore_h2h -v
