name: HKJC Live Market Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '30 22 * * *' # 06:30 Hong Kong time
    - cron: '30 10 * * *' # 18:30 Hong Kong time
  push:
    paths:
      - '.github/workflows/hkjc_hourly.yml'
      - 'scripts/normalize_hkjc.py'

permissions:
  contents: write

concurrency:
  group: hkjc-live-market-feed
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      HKJC_UPSTREAM_SHA: '1d2234102dc8f1ee23d0b45c25c125dc3ef98176'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture latest HKJC matches and HAD odds
        run: |
          rm -rf /tmp/hkjc-direct
          git clone --filter=blob:none --no-checkout https://github.com/sososo829/hkjc-football-scraper.git /tmp/hkjc-direct
          git -C /tmp/hkjc-direct fetch --depth 1 origin "$HKJC_UPSTREAM_SHA"
          git -C /tmp/hkjc-direct checkout --detach "$HKJC_UPSTREAM_SHA"
          cd /tmp/hkjc-direct
          python -m hkjc list --format json --out /tmp/hkjc_matches.json
          python -m hkjc odds --page HAD --format json --out /tmp/hkjc_had.json
          cd "$GITHUB_WORKSPACE"
          python scripts/normalize_hkjc.py \
            --matches /tmp/hkjc_matches.json \
            --had /tmp/hkjc_had.json \
            --horizon-hours 36 \
            --live-retain-minutes 150

      - name: Validate HKJC market feed
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          for name in ('data/hkjc_current.csv', 'data/hkjc_targets.csv'):
              p = Path(name)
              if not p.exists():
                  raise SystemExit(f'missing {name}')
              with p.open(encoding='utf-8-sig', newline='') as fh:
                  rows = list(csv.DictReader(fh))
              if not rows:
                  raise SystemExit(f'zero rows in {name}')
              print(f'PASS {name} rows={len(rows)}')
          PY

      - name: Commit latest HKJC market state
        run: |
          git config user.name 'fast-tracker-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/hkjc_current.csv data/hkjc_targets.csv
          if git diff --cached --quiet; then
            echo 'No HKJC changes to commit.'
          else
            git commit -m 'Refresh HKJC live market feed [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo 'HKJC live market push failed after retries.' >&2
                exit 1
              fi
              echo "HKJC push raced with another writer; retrying ($attempt/4)."
              sleep 2
            done
          fi
