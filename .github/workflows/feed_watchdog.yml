name: Feed Freshness Watchdog

on:
  workflow_dispatch:
  schedule:
    # Hourly, offset from the main model / capture jobs.
    # This is a lightweight control-plane check; it only dispatches heavy
    # recovery when freshness or canonical target coverage actually drifts.
    - cron: '12 * * * *'
  push:
    paths:
      - '.github/workflows/feed_watchdog.yml'
# Phase 1 canonical coverage heartbeat 2026-09-22

permissions:
  contents: read
  actions: write

concurrency:
  group: feed-freshness-watchdog
  cancel-in-progress: true

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout current feed timestamps
        uses: actions/checkout@v4

      - name: Decide whether production and model feeds are stale
        id: freshness
        run: |
          python - <<'PY'
          import csv
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from zoneinfo import ZoneInfo

          HKT = ZoneInfo('Asia/Hong_Kong')

          def parse(value):
              value = (value or '').strip()
              if not value:
                  return None
              try:
                  dt = datetime.fromisoformat(value.replace('Z', '+00:00'))
              except ValueError:
                  try:
                      dt = datetime.strptime(value, '%Y-%m-%d %H:%M:%S').replace(tzinfo=HKT)
                  except ValueError:
                      return None
              if dt.tzinfo is None:
                  dt = dt.replace(tzinfo=HKT)
              return dt.astimezone(timezone.utc)

          def age_minutes(path, column='fetched_at_hkt'):
              p = Path(path)
              if not p.exists():
                  return None
              newest = None
              with p.open(encoding='utf-8-sig', newline='') as fh:
                  for row in csv.DictReader(fh):
                      dt = parse(row.get(column, ''))
                      if dt and (newest is None or dt > newest):
                          newest = dt
              if newest is None:
                  return None
              return (datetime.now(timezone.utc) - newest).total_seconds() / 60

          hkjc_age = age_minutes('data/hkjc_targets.csv')
          forebet_age = age_minutes('data/forebet_current.csv')
          model_age = age_minutes('data/model_current.csv')
          form_age = age_minutes('data/form_current.csv')

          # Static HKJC is intentionally lower-frequency because Supabase owns
          # the high-frequency official HKJC authority. Forebet/model files must
          # still remain reasonably fresh.
          source_stale = (
              hkjc_age is None or hkjc_age > 780 or
              forebet_age is None or forebet_age > 240
          )
          model_stale = (
              model_age is None or model_age > 180 or
              form_age is None or form_age > 180
          )

          def fmt(v):
              return 'MISSING' if v is None else f'{v:.1f}m'

          print(
              'WATCHDOG '
              f'hkjc={fmt(hkjc_age)} forebet={fmt(forebet_age)} '
              f'model={fmt(model_age)} form={fmt(form_age)} '
              f'source_stale={int(source_stale)} model_stale={int(model_stale)}'
          )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'source_stale={str(source_stale).lower()}\n')
              fh.write(f'model_stale={str(model_stale).lower()}\n')
          PY

      - name: Check live Supabase canonical target coverage
        id: canonical
        env:
          PHASE1_FEED_URL: https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/app-phase1-feed?hours=48
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request

          url = os.environ['PHASE1_FEED_URL']
          gap = False
          missing_ids = []
          stale_ids = []
          total = 0
          try:
              req = urllib.request.Request(
                  url,
                  headers={
                      'Accept': 'application/json',
                      'User-Agent': 'fast-tracker-feed-watchdog/1.0',
                  },
              )
              with urllib.request.urlopen(req, timeout=25) as response:
                  payload = json.load(response)
              matches = payload.get('matches') or []
              total = len(matches)
              for match in matches:
                  if match.get('liveNow'):
                      continue
                  health = match.get('health') or {}
                  event_id = str(match.get('id') or '').strip()
                  state = str(health.get('forebetState') or '').strip()
                  freshness = str(health.get('forebetCheckFreshness') or '').strip().upper()
                  # Genuine source limitations are explicit FIXTURE_ONLY /
                  # UNRESOLVED states and must not cause an endless recovery loop.
                  # A blank state means a new canonical HKJC target has not yet
                  # passed through Forebet availability classification.
                  if event_id and not state:
                      missing_ids.append(event_id)
                  elif event_id and freshness == 'STALE':
                      stale_ids.append(event_id)
              gap = bool(missing_ids)
              print(
                  'CANONICAL_COVERAGE '
                  f'targets={total} missing_availability={len(missing_ids)} '
                  f'stale_checks={len(stale_ids)} '
                  f'missing_ids={",".join(missing_ids[:30]) or "-"}'
              )
          except Exception as exc:
              # Do not create a dispatch storm if the diagnostic endpoint itself
              # is temporarily unreachable; the age gate above remains active.
              print(f'WARN canonical coverage probe failed: {exc}')
              gap = False

          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as fh:
              fh.write(f'coverage_gap={str(gap).lower()}\n')
              fh.write(f'missing_count={len(missing_ids)}\n')
          PY

      - name: Recover Forebet/HKJC source layer when stale or uncovered
        if: steps.freshness.outputs.source_stale == 'true' || steps.canonical.outputs.coverage_gap == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "Source recovery required: stale=${{ steps.freshness.outputs.source_stale }} missing=${{ steps.canonical.outputs.missing_count }}"
          gh workflow run forebet_daily.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Recover DC/Pi/Form model layer when stale
        if: steps.freshness.outputs.model_stale == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo 'Model layer is stale; dispatching model_daily.yml once.'
          gh workflow run model_daily.yml --repo "$GITHUB_REPOSITORY" --ref main

      - name: Healthy feeds
        if: steps.freshness.outputs.source_stale != 'true' && steps.freshness.outputs.model_stale != 'true' && steps.canonical.outputs.coverage_gap != 'true'
        run: echo 'Source/model freshness and live Supabase canonical Forebet coverage are healthy.'
