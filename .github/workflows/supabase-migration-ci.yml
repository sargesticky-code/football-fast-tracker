name: Supabase Migration CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [supabase-migration]
    paths:
      - "supabase/**"
      - "scripts/supabase_*.py"
      - ".github/workflows/supabase-*.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fast_tracker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python syntax
        run: |
          python -m py_compile scripts/supabase_sync.py
          python -m py_compile scripts/supabase_sync_extended.py
          python -m py_compile scripts/supabase_validate.py
      - name: SQL migrations
        run: |
          for f in supabase/migrations/*.sql; do
            echo "Applying $f"
            psql -h localhost -U postgres -d fast_tracker_test -v ON_ERROR_STOP=1 -f "$f"
          done
      - name: Smoke check views
        run: |
          psql -h localhost -U postgres -d fast_tracker_test -v ON_ERROR_STOP=1 <<'SQL'
          select * from public.fast_tracker_live_v limit 0;
          select * from public.forebet_effective_v limit 0;
          select * from public.fast_tracker_live_v2 limit 0;
          SQL
