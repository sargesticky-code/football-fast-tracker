name: Phase 3 Heavy Lane

on:
  push:
    branches: [phase3-live-intelligence]
    paths:
      - 'phase3/heavy_lane.py'
      - 'phase3/heavy_collector.py'
      - 'phase3/heavy_service.py'
      - 'phase3/fotmob_heavy.py'
      - 'phase3/fotmob_heavy_source.py'
      - 'tests/test_phase3_heavy_lane.py'
      - 'tests/test_phase3_heavy_collector.py'
      - 'tests/test_phase3_heavy_service.py'
      - 'tests/test_phase3_fotmob_heavy.py'
      - 'tests/test_phase3_fotmob_heavy_source.py'
      - '.github/workflows/phase3_heavy_lane.yml'
  workflow_dispatch:

jobs:
  verify-heavy-lane:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Layer 6 heavy contracts
        run: |
          python -m unittest \
            tests.test_phase3_heavy_lane \
            tests.test_phase3_heavy_collector \
            tests.test_phase3_heavy_service \
            tests.test_phase3_fotmob_heavy \
            tests.test_phase3_fotmob_heavy_source
