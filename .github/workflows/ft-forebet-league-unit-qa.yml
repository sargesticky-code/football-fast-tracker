name: Forebet extra leagues unit contract (no capture)
on:
  push:
    branches: [fix/ft-forebet-proven-league-coverage-20261010]
    paths:
      - scripts/capture_forebet_canonical_light.py
      - tests/test_capture_forebet_canonical_light.py
      - .github/workflows/ft-forebet-league-unit-qa.yml
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.12.3
      - run: python -m unittest discover -s tests -p test_capture_forebet_canonical_light.py -v
