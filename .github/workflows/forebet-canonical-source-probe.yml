name: Forebet canonical source probe (no publication)
on:
  push:
    branches: [fix/ft-forebet-canonical-lean-20261010]
    paths:
      - scripts/scrape_forebet.py
      - scripts/forebet_canonical_source_probe.py
      - tests/test_forebet_canonical_source_probe.py
      - .github/workflows/forebet-canonical-source-probe.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forebet-canonical-source-probe
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies only
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.12.3 lxml==5.4.0
      - name: Validate canonical matching and original Forebet parser
        run: python -m unittest discover -s tests -p 'test_forebet_canonical_source_probe.py' -v
      - name: Attempt bounded public Forebet capture only on explicit manual run
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/forebet_canonical_source_probe.py
      - name: Upload dry-run evidence if available
        if: github.event_name == 'workflow_dispatch' && always()
        uses: actions/upload-artifact@v4
        with:
          name: forebet-canonical-source-probe
          path: /tmp/ft_forebet_canonical_source_probe.json
          if-no-files-found: ignore
          retention-days: 3
