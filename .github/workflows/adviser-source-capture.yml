name: BetClan and SportyTrader source capture and verified publication

on:
  workflow_dispatch:
    inputs:
      replay_run_id:
        description: Successful prior run ID whose saved adviser artifact should be reprocessed
        required: false
        type: string
  push:
    branches: [main]
    paths:
      - 'scripts/adviser_source_capture.py'
      - 'tests/test_adviser_source_capture.py'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/adviser_source_capture.py'
      - 'tests/test_adviser_source_capture.py'
      - '.github/workflows/adviser-source-capture.yml'
  schedule:
    # One source snapshot per day (13:30 HKT). No constant scraping or writes to production.
    - cron: "30 5 * * *"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: adviser-source-capture
  cancel-in-progress: false

jobs:
  source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Validate parsers offline
        run: python -m unittest discover -s tests -p test_adviser_source_capture.py -v
      - name: Replay saved adviser source artifact
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.replay_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPLAY_RUN_ID: ${{ github.event.inputs.replay_run_id }}
        run: |
          if [ -z "$REPLAY_RUN_ID" ]; then
            REPLAY_RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow adviser-source-capture.yml --event push --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          fi
          if [[ ! "$REPLAY_RUN_ID" =~ ^[0-9]{6,20}$ ]]; then
            echo "replay_run_id must be a numeric GitHub Actions run ID" >&2
            exit 1
          fi
          mkdir -p /tmp/adviser-replay
          gh run download "$REPLAY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name adviser-source-observations --dir /tmp/adviser-replay
          test -s /tmp/adviser-replay/adviser-source.json
          gh run download "$REPLAY_RUN_ID" --repo "$GITHUB_REPOSITORY" --name adviser-source-evidence --dir /tmp/adviser-evidence
          python scripts/adviser_source_capture.py --output /tmp/adviser-source.json --replay-input /tmp/adviser-replay/adviser-source.json --evidence-dir /tmp/adviser-evidence
      - name: Validate capture CLI matches the bounded source contract
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          src=Path('scripts/adviser_source_capture.py').read_text()
          ast.parse(src)
          assert 'choices=range(9)' in src
          assert 'related_evidence_limit <= 8' in src
          print('RELATED_EVIDENCE_CLI_0_TO_8_OK')
          PY
      - name: Collect today's and tomorrow's source records
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && github.event.inputs.replay_run_id == '')
        run: python scripts/adviser_source_capture.py --output /tmp/adviser-source.json --limit 100 --evidence-dir /tmp/adviser-evidence --related-evidence-limit 8
      - name: Publish authenticated observations on main
        if: github.ref == 'refs/heads/main' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          ADVISER_OUTPUT: /tmp/adviser-source.json
        run: python scripts/publish_adviser_source.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adviser-source-observations
          path: /tmp/adviser-source.json
          if-no-files-found: warn
          retention-days: 5
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adviser-source-evidence
          path: /tmp/adviser-evidence
          if-no-files-found: ignore
          retention-days: 5
