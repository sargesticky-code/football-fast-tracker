name: BetClan and SportyTrader source capture (unmatched only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/adviser-source-capture.yml'
  pull_request:
    branches: [main]
    paths:
      - 'scripts/adviser_source_capture.py'
      - 'tests/test_adviser_source_capture.py'
      - '.github/workflows/adviser-source-capture.yml'
  schedule:
    # One source snapshot per day (13:30 HKT). No constant scraping or writes to production.
    - cron: "30 5 * * *"

permissions:
  contents: read

concurrency:
  group: adviser-source-capture
  cancel-in-progress: true

jobs:
  source-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.5
      - name: Validate parsers offline
        run: python -m unittest discover -s tests -p test_adviser_source_capture.py -v
      - name: Collect today's and tomorrow's source records
        if: github.event_name != 'pull_request'
        run: python scripts/adviser_source_capture.py --output /tmp/adviser-source.json --limit 100
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: adviser-source-observations
          path: /tmp/adviser-source.json
          if-no-files-found: warn
          retention-days: 5
