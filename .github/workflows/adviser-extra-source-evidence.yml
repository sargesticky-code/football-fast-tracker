name: Extra adviser source evidence (PrimaTips + Statarea)
on:
  schedule:
    # Once daily at 12:40 Hong Kong time. Four bounded pages in total.
    - cron: "40 4 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - scripts/additional_adviser_sources.py
      - tests/test_additional_adviser_sources.py
      - supabase/functions/adviser-extra-source-publish/**
      - .github/workflows/adviser-extra-source-evidence.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/additional_adviser_sources.py
      - tests/test_additional_adviser_sources.py
      - .github/workflows/adviser-extra-source-evidence.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: extra-adviser-source-evidence
  cancel-in-progress: false

jobs:
  source-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install requests==2.32.5 beautifulsoup4==4.13.5
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Validate private source quarantine Edge function
        run: deno check supabase/functions/adviser-extra-source-publish/index.ts
      - name: Validate source identity and probability tests offline
        run: python -m unittest discover -s tests -p test_additional_adviser_sources.py -v
      - name: Capture bounded source observations only (no Supabase writes)
        if: github.event_name != 'pull_request'
        run: python scripts/additional_adviser_sources.py --output /tmp/adviser-extra-sources.json
      - name: Obtain scoped GitHub OIDC identity
        id: oidc
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL --connect-timeout 10 --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=fast-tracker-supabase")"
          token="$(python -c 'import json,sys;print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Publish raw provider observations to private Supabase quarantine
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          SOURCE_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 10 --max-time 40 \
            -X POST -H "Authorization: Bearer $SOURCE_OIDC" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/adviser-extra-sources.json \
            'https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/adviser-extra-source-publish' \
            -o /tmp/extra-source-quarantine-ack.json
          python - <<'PY'
          import json
          evidence=json.load(open('/tmp/adviser-extra-sources.json'))
          ack=json.load(open('/tmp/extra-source-quarantine-ack.json'))
          assert ack.get('source')=='EXTRA_ADVISER_SOURCE_ONLY'
          assert ack.get('received')==len(evidence['records'])==ack.get('stored')
          assert ack.get('verified_identity_count')==0
          assert ack.get('production_forecasts_published')==0
          print('EXTRA_SOURCE_PRIVATE_STORED',ack['stored'],
                'VERIFIED_IDENTITY',0,'PUBLIC_FORECASTS',0)
          PY
      - name: Preserve bounded source-only evidence
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: adviser-extra-source-observations
          path: /tmp/adviser-extra-sources.json
          if-no-files-found: warn
          retention-days: 3
