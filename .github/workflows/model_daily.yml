name: Football Shadow Models

on:
  workflow_dispatch:
  schedule:
    - cron: '5 23 * * *' # 07:05 Hong Kong time, after the 06:45 source refresh
  push:
    paths:
      - '.github/workflows/model_daily.yml'

permissions:
  contents: write

concurrency:
  group: football-shadow-models
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HKJC_UPSTREAM_SHA: '1d2234102dc8f1ee23d0b45c25c125dc3ef98176'
      HKJC_HISTORY_BOOTSTRAP_MONTHS: '12'
      HKJC_HISTORY_REFRESH_MONTHS: '2'
    steps:
      - name: Checkout latest production feed
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model.txt

      - name: Install model dependencies
        run: pip install -r requirements-model.txt

      - name: Clone pinned HKJC GraphQL client
        run: |
          rm -rf /tmp/hkjc-direct
          git clone --filter=blob:none --no-checkout https://github.com/sososo829/hkjc-football-scraper.git /tmp/hkjc-direct
          git -C /tmp/hkjc-direct fetch --depth 1 origin "$HKJC_UPSTREAM_SHA"
          git -C /tmp/hkjc-direct checkout --detach "$HKJC_UPSTREAM_SHA"

      - name: Capture raw HKJC listing with stable team ids
        run: |
          PYTHONPATH=/tmp/hkjc-direct python - <<'PY'
          import json
          from hkjc.scraper import HKJCFootball
          rows = HKJCFootball().list_matches()
          if not rows:
              raise SystemExit('HKJC raw listing returned zero matches')
          with open('/tmp/hkjc_raw_matches.json', 'w', encoding='utf-8') as fh:
              json.dump(rows, fh, ensure_ascii=False)
          print(f'HKJC_RAW_LIST rows={len(rows)}')
          PY

      - name: Refresh incremental HKJC results history for current teams
        run: PYTHONPATH=/tmp/hkjc-direct python scripts/update_hkjc_history.py --raw-list /tmp/hkjc_raw_matches.json

      - name: Build independent Dixon-Coles and Pi shadow feed
        run: python scripts/build_shadow_model.py

      - name: Validate shadow model output
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          def rows(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as fh:
                  return list(csv.DictReader(fh))

          source = rows('data/forebet_current.csv')
          model = rows('data/model_current.csv')
          teams = rows('data/hkjc_current_teams.csv')
          history = rows('data/hkjc_history.csv')

          if len(model) != len(source):
              raise SystemExit(f'model/source row mismatch {len(model)}/{len(source)}')
          source_ids = {r['hkjc_event_id'] for r in source}
          model_ids = {r['hkjc_event_id'] for r in model}
          team_ids = {r['hkjc_event_id'] for r in teams}
          if source_ids != model_ids:
              raise SystemExit('model event ids do not match current Forebet feed')
          if source_ids != team_ids:
              raise SystemExit(f'HKJC team-id map mismatch source={len(source_ids)} map={len(team_ids)}')
          if source and not history:
              raise SystemExit('HKJC results history is empty for non-empty source')

          modeled = 0
          hkjc_modeled = 0
          fd_modeled = 0
          for row in model:
              if row.get('quality') != 'MODELED':
                  continue
              modeled += 1
              dc = [float(row[k]) for k in ('dc_prob_home','dc_prob_draw','dc_prob_away')]
              pi = [float(row[k]) for k in ('pi_prob_home','pi_prob_draw','pi_prob_away')]
              if abs(sum(dc) - 1) > 0.015:
                  raise SystemExit(f'bad Dixon-Coles probability sum {row["hkjc_event_id"]}: {sum(dc)}')
              if abs(sum(pi) - 1) > 0.015:
                  raise SystemExit(f'bad Pi probability sum {row["hkjc_event_id"]}: {sum(pi)}')
              source_name = row.get('model_source') or ''
              if source_name.startswith('HKJC'):
                  hkjc_modeled += 1
              elif source_name.startswith('football-data'):
                  fd_modeled += 1
          print(
              f'PASS shadow_rows={len(model)} modeled={modeled} '
              f'football_data={fd_modeled} hkjc_history={hkjc_modeled} '
              f'fail_closed={len(model)-modeled} history_rows={len(history)} team_maps={len(teams)}'
          )
          PY

      - name: Commit shadow feed and incremental HKJC history
        run: |
          git config user.name 'fast-tracker-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/model_current.csv data/hkjc_history.csv data/hkjc_current_teams.csv
          if git diff --cached --quiet; then
            echo 'No model/history changes to commit.'
          else
            git commit -m 'Update global shadow models and HKJC history [skip ci]'
            git pull --rebase origin main
            git push
          fi
