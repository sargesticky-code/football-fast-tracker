name: Football Shadow Models

on:
  workflow_dispatch:
  schedule:
    - cron: '5 23 * * *' # 07:05 Hong Kong time, after the 06:45 source refresh
    - cron: '5 3 * * *'  # 11:05 Hong Kong time, after the 10:45 Forebet refresh
    - cron: '5 11 * * *' # 19:05 Hong Kong time, after the 18:45 source refresh
  push:
    paths:
      - 'scripts/team_name_master.py'
      - '.github/workflows/model_daily.yml'
      - 'scripts/build_shadow_model.py'
      - 'scripts/update_hkjc_history.py'
      - 'scripts/quality_gate_shadow_models.py'
      - 'scripts/build_team_form_summary.py'
      - 'requirements-model.txt'
# Phase 1 recovery heartbeat 2026-09-20

permissions:
  contents: write

concurrency:
  group: football-shadow-models
  cancel-in-progress: true

jobs:
  model:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      HKJC_UPSTREAM_SHA: '1d2234102dc8f1ee23d0b45c25c125dc3ef98176'
      HKJC_HISTORY_BOOTSTRAP_MONTHS: '12'
      HKJC_HISTORY_REFRESH_MONTHS: '2'
      HKJC_HISTORY_MAX_BOOTSTRAP_TEAMS: '4'
      HKJC_HISTORY_MAX_REFRESH_TEAMS: '24'
    steps:
      - name: Checkout latest production feed
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-model.txt

      - name: Install model dependencies
        run: pip install -r requirements-model.txt

      - name: Clone pinned HKJC GraphQL client
        run: |
          rm -rf /tmp/hkjc-direct
          git clone --filter=blob:none --no-checkout https://github.com/sososo829/hkjc-football-scraper.git /tmp/hkjc-direct
          git -C /tmp/hkjc-direct fetch --depth 1 origin "$HKJC_UPSTREAM_SHA"
          git -C /tmp/hkjc-direct checkout --detach "$HKJC_UPSTREAM_SHA"

      - name: Capture raw HKJC listing with stable team ids
        run: |
          PYTHONPATH=/tmp/hkjc-direct python - <<'PY'
          import json
          from hkjc.scraper import HKJCFootball
          rows = HKJCFootball().list_matches()
          if not rows:
              raise SystemExit('HKJC raw listing returned zero matches')
          with open('/tmp/hkjc_raw_matches.json', 'w', encoding='utf-8') as fh:
              json.dump(rows, fh, ensure_ascii=False)
          print(f'HKJC_RAW_LIST rows={len(rows)}')
          PY

      - name: Refresh incremental HKJC results history for current teams
        run: PYTHONPATH=/tmp/hkjc-direct python scripts/update_hkjc_history.py --raw-list /tmp/hkjc_raw_matches.json

      - name: Build Dixon-Coles and Pi candidates
        run: python scripts/build_shadow_model.py

      - name: Reject sparse-network HKJC DC Pi fits
        run: python scripts/quality_gate_shadow_models.py

      - name: Build global HKJC Team-Form Poisson shadow feed
        run: python scripts/build_form_model.py

      - name: Build display-ready recent team form summary
        run: python scripts/build_team_form_summary.py

      - name: Validate shadow model outputs and history coverage
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          def rows(path):
              with Path(path).open(encoding='utf-8-sig', newline='') as fh:
                  return list(csv.DictReader(fh))

          forebet_source = rows('data/forebet_current.csv')
          hkjc_source = rows('data/hkjc_current.csv')
          model_targets = [
              r for r in hkjc_source
              if str(r.get('selling') or '').strip() in ('1','true','TRUE')
              and all(str(r.get(k) or '').strip() for k in ('had_home','had_draw','had_away'))
              and str(r.get('hkjc_event_id') or '').strip()
          ]
          model = rows('data/model_current.csv')
          form = rows('data/form_current.csv')
          teams = rows('data/hkjc_current_teams.csv')
          history = rows('data/hkjc_history.csv')
          coverage = rows('data/hkjc_history_coverage.csv')

          model_target_ids = {r['hkjc_event_id'] for r in model_targets}
          forebet_ids = {r['hkjc_event_id'] for r in forebet_source}
          if len(model) != len(model_targets) or {r['hkjc_event_id'] for r in model} != model_target_ids:
              raise SystemExit('DC/Pi model rows do not match current HKJC selling HAD targets')
          if len(form) != len(model_targets) or {r['hkjc_event_id'] for r in form} != model_target_ids:
              raise SystemExit('form model rows do not match current HKJC selling HAD targets')
          if {r['hkjc_event_id'] for r in teams} != model_target_ids:
              raise SystemExit('HKJC team-id map does not match current HKJC selling HAD targets')
          if forebet_source and not history:
              raise SystemExit('HKJC results history is empty for non-empty Forebet source')

          current_team_ids = {
              str(r.get(k) or '').strip()
              for r in teams for k in ('home_id','away_id')
              if str(r.get(k) or '').strip()
          }
          coverage_by_id = {str(r.get('team_id') or '').strip(): r for r in coverage if str(r.get('team_id') or '').strip()}
          missing_coverage = sorted(current_team_ids - set(coverage_by_id))
          if missing_coverage:
              raise SystemExit('current target teams missing explicit history coverage: ' + ','.join(missing_coverage))
          partial_coverage = sorted(
              tid for tid in current_team_ids
              if coverage_by_id[tid].get('status') != 'BOOTSTRAPPED'
          )

          dc_modeled = 0
          rejected_sparse = 0
          for row in model:
              if row.get('quality') == 'SPARSE_GRAPH_REJECTED':
                  rejected_sparse += 1
                  if any(row.get(k) for k in ('dc_prob_home','dc_prob_draw','dc_prob_away','pi_prob_home','pi_prob_draw','pi_prob_away')):
                      raise SystemExit(f'sparse graph row retained probabilities: {row["hkjc_event_id"]}')
                  continue
              if row.get('quality') != 'MODELED':
                  continue
              dc_modeled += 1
              dc = [float(row[k]) for k in ('dc_prob_home','dc_prob_draw','dc_prob_away')]
              pi = [float(row[k]) for k in ('pi_prob_home','pi_prob_draw','pi_prob_away')]
              if abs(sum(dc) - 1) > 0.015 or abs(sum(pi) - 1) > 0.015:
                  raise SystemExit(f'bad DC/Pi probability sum: {row["hkjc_event_id"]}')
              if not str(row.get('model_source') or '').startswith('football-data'):
                  raise SystemExit(f'non-full-league DC/Pi row passed: {row["hkjc_event_id"]}')

          form_modeled = 0
          for row in form:
              if row.get('quality') != 'FORM_MODELED':
                  continue
              form_modeled += 1
              p = [float(row[k]) for k in ('form_prob_home','form_prob_draw','form_prob_away')]
              if abs(sum(p) - 1) > 0.015:
                  raise SystemExit(f'bad form probability sum: {row["hkjc_event_id"]}')
              xg = float(row['form_xg_home']) + float(row['form_xg_away'])
              if not 0.5 <= xg <= 7.0:
                  raise SystemExit(f'implausible form xG: {row["hkjc_event_id"]} {xg}')

          print(
              f'PASS model_targets={len(model_targets)} forebet_reference={len(forebet_source)} dc_pi_full_league={dc_modeled} '
              f'sparse_dc_pi_rejected={rejected_sparse} form_modeled={form_modeled} '
              f'form_fail_closed={len(form)-form_modeled} history_rows={len(history)} '
              f'coverage_rows={len(coverage)} current_coverage_partial={len(partial_coverage)}'
          )
          PY

      - name: Commit shadow feeds and incremental HKJC history
        run: |
          git config user.name 'fast-tracker-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add \
            data/model_current.csv \
            data/form_current.csv \
            data/team_form_summary.csv \
            data/hkjc_history.csv \
            data/hkjc_current_teams.csv \
            data/hkjc_history_coverage.csv
          if git diff --cached --quiet; then
            echo 'No model/history changes to commit.'
          else
            git commit -m 'Update validated shadow models and HKJC history [skip ci]'
            for attempt in 1 2 3 4; do
              if git pull --rebase origin main && git push; then
                exit 0
              fi
              if [ "$attempt" -eq 4 ]; then
                echo 'Model/history push failed after retries.' >&2
                exit 1
              fi
              git rebase --abort || true
              echo "Model/history push raced with another writer; retrying ($attempt/4)."
              sleep 2
            done
          fi
