name: Prediction fallback refresh

on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/update_prediction_fallback.py"
      - "scripts/check_prediction_fallback_policy.py"
      - "data/prediction_source_registry.csv"
      - ".github/workflows/prediction-fallback.yml"
  schedule:
    # 06:30 and 18:30 Hong Kong time (UTC+8)
    - cron: "30 22,10 * * *"

permissions:
  contents: write

concurrency:
  group: prediction-fallback-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check requests==2.32.5
      - name: Check APWin fixture matching policy
        run: python scripts/check_prediction_fallback_policy.py
      - run: python scripts/update_prediction_fallback.py
      - name: Commit refreshed fallback CSV
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prediction_fallback_current.csv
          if git diff --cached --quiet; then
            echo "No fallback feed changes"
          else
            git commit -m "Refresh prediction fallback feed"
            git pull --rebase origin main
            git push
          fi
