name: Phase 2 Identity
on:
  workflow_dispatch:
  pull_request:
    branches:
      - app-v1
    paths:
      - 'scripts/phase2_*.py'
      - 'data/phase2_*'
      - '.github/workflows/phase2_identity.yml'
  schedule:
    - cron: '18 * * * *'
permissions:
  contents: write
concurrency:
  group: phase2-identity-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: false
jobs:
  identity:
    if: (github.event_name == 'pull_request' && github.head_ref == 'phase2-human-intelligence') || (github.event_name != 'pull_request' && github.ref == 'refs/heads/phase2-human-intelligence')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase2-human-intelligence
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Phase 2 runtime
        run: python -m pip install 'requests==2.32.5' 'curl_cffi>=0.13,<0.15'
      - name: Execute complete Layer 1 pipeline
        run: python scripts/phase2_run_layer1.py
      - name: Persist Phase 2 snapshots only
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "phase2-bot"
          git config user.email "phase2-bot@users.noreply.github.com"
          git add data/phase2_hkjc_current.csv data/phase2_hkjc_capture_health.json data/phase2_team_identity_targets.csv data/phase2_team_identity_evidence.csv data/phase2_identity_resolution_diagnostics.csv data/phase2_identity_health.json
          if ! git diff --cached --quiet; then
            git commit -m "phase2: refresh current identity universe"
            git push origin HEAD:phase2-human-intelligence
          fi
