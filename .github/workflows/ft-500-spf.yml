name: FT500 Official China SPF Verified Capture
on:
  schedule:
    - cron: '13,43 * * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ft-500-spf.yml'
permissions:
  contents: read
  id-token: write
concurrency:
  group: ft500-official-spf
  cancel-in-progress: false
jobs:
  capture-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify canonical identity safety
        run: python -m unittest discover -s tests -p test_capture_500_spf.py -v
      - name: Fetch official 500 XML and match page once
        id: evidence
        shell: bash
        run: |
          set -euo pipefail
          python scripts/capture_500_spf.py
          python - <<'PY'
          import json,os
          x=json.load(open('/tmp/ft500-spf-canonical.json'))
          if x['source']!='CHINA_500_SPF' or not isinstance(x['rows'],list):
              raise SystemExit('unexpected official source payload')
          print('FT500_CANONICAL_VERIFIED', x['accepted'], 'of', x['source_rows'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('has_rows='+('true' if x['rows'] else 'false')+'\n')
          PY
      - name: Obtain GitHub OIDC for service-only publisher
        if: steps.evidence.outputs.has_rows == 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL --connect-timeout 10 --max-time 20 \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=fast-tracker-supabase")"
          token="$(python -c 'import json,sys;print(json.load(sys.stdin)["value"])' <<<"$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Publish verified SPF without touching Bet365
        if: steps.evidence.outputs.has_rows == 'true'
        env:
          FT500_OIDC: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body -sS --connect-timeout 10 --max-time 30 \
            -X POST -H "Authorization: Bearer $FT500_OIDC" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/ft500-spf-canonical.json \
            "https://hekqxhgjexzxnecwhyao.supabase.co/functions/v1/ft-500-spf-publish" \
            -o /tmp/ft500-publish-result.json
          python - <<'PY'
          import json
          result=json.load(open('/tmp/ft500-publish-result.json'))
          if result.get('source')!='CHINA_500_SPF' or not isinstance(result.get('accepted'),int):
              raise SystemExit('publisher did not confirm verified source')
          print('FT500_PUBLISHED',result['accepted'],'written',result.get('written'))
          PY
