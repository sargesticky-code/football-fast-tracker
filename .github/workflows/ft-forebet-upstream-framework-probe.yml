name: FT Forebet upstream framework one-shot
on:
  push:
    branches: [probe/ft-forebet-upstream-framework-20261010]
    paths:
      - scripts/probe_forebet_upstream_framework.py
      - .github/workflows/ft-forebet-upstream-framework-probe.yml
permissions:
  contents: read
concurrency:
  group: forebet-upstream-proof
  cancel-in-progress: true
jobs:
  single-page-proof:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    services:
      browser-helper:
        image: ghcr.io/flaresolverr/flaresolverr:latest
        ports:
          - 8191:8191
    steps:
      - uses: actions/checkout@v4
      - name: Install existing Forebet parser libraries
        run: python -m pip install --disable-pip-version-check requests==2.32.5 beautifulsoup4==4.12.3 lxml==5.4.0
      - name: Existing parser safety tests
        run: python -m unittest discover -s tests -p test_forebet_canonical_source_probe.py -v
      - name: Probe one public 1X2 page with upstream browser-helper pattern
        env:
          LOCAL_BROWSER_HELPER: http://127.0.0.1:8191/v1
        run: python scripts/probe_forebet_upstream_framework.py
      - name: Retain bounded JSON proof (no HTML or credentials)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: forebet-upstream-framework-proof
          path: /tmp/ft-forebet-upstream-proof.json
          if-no-files-found: ignore
          retention-days: 2
