name: Probe Jina Forebet Detail
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_jina_html.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspect generic Forebet match detail markdown
        shell: bash
        run: |
          set -euo pipefail
          TARGET='https://www.forebet.com/en/football/matches/wahda-abu-dhabi-kuwait-sc-2549766'
          curl -LsS --fail --max-time 90 "https://r.jina.ai/$TARGET" -H 'x-timeout: 25' -o /tmp/m.txt
          echo "bytes=$(wc -c </tmp/m.txt)"
          python - <<'PY'
          s=open('/tmp/m.txt',encoding='utf-8',errors='ignore').read()
          for needle in ['Prob. %','Under/Over','2.5','9.5','Avg. corners','Wahda Abu Dhabi Kuwait SC']:
              print('NEEDLE',needle,'COUNT',s.count(needle))
          for marker in ['Under/Over\n\n2.5','Under/Over\n\n9.5','Avg. corners']:
              i=s.find(marker)
              print('\nMARKER',repr(marker),'AT',i)
              if i>=0: print(s[max(0,i-450):i+1200])
          PY
