name: Probe Jina Forebet Routine Markets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_jina_html.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe fixed today and tomorrow Forebet market pages
        shell: bash
        run: |
          set -euo pipefail
          URLS=(
            'https://www.forebet.com/en/football-tips-and-predictions-for-today/predictions-1x2'
            'https://www.forebet.com/en/football-tips-and-predictions-for-tomorrow/predictions-1x2'
            'https://www.forebet.com/en/football-tips-and-predictions-for-today/predictions-under-over-goals'
            'https://www.forebet.com/en/football-tips-and-predictions-for-tomorrow/under-over-25-goals/'
            'https://www.forebet.com/en/football-tips-and-predictions-for-today/corners'
            'https://www.forebet.com/en/football-tips-and-predictions-for-tomorrow/corners'
          )
          NAMES=(today_1x2 tomorrow_1x2 today_ou tomorrow_ou today_corners tomorrow_corners)
          for i in "${!URLS[@]}"; do
            M="${NAMES[$i]}"; OUT="/tmp/$M.html"
            if ! curl -LsS --fail --max-time 90 "https://r.jina.ai/${URLS[$i]}" -H 'x-respond-with: html' -H 'x-timeout: 25' -o "$OUT"; then
              echo "MARKET=$M FETCH_FAILED"; continue
            fi
            RCNT=$(python -c 'import re,sys; s=open(sys.argv[1],encoding="utf-8",errors="ignore").read(); print(len(re.findall(r"class=\"[^\"]*rcnt",s)))' "$OUT")
            echo "MARKET=$M bytes=$(wc -c <"$OUT") rcnt=$RCNT"
            for needle in 'Spartak Moscow' 'Rodina Moscow' 'Wahda Abu Dhabi' 'Al Khaldiya'; do
              if grep -Fqi "$needle" "$OUT"; then echo "  FOUND $needle"; else echo "  MISSING $needle"; fi
            done
          done
