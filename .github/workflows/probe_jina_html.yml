name: Probe Forebet Direct Chrome
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_jina_html.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install Playwright Python
        run: pip install playwright
      - name: Probe Forebet with runner Chrome
        shell: bash
        run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          urls={
            'one':'https://www.forebet.com/en/football-predictions/predictions-1x2/2026-09-16/by-league',
            'ou':'https://www.forebet.com/en/component/forebet/under-over',
            'corners':'https://www.forebet.com/en/football-tips-and-predictions-for-today/corners',
          }
          needles=['Spartak Moscow','Rodina Moscow','Wahda Abu Dhabi','Al Khaldiya']
          with sync_playwright() as p:
            browser=p.chromium.launch(channel='chrome',headless=True,args=['--no-sandbox','--disable-blink-features=AutomationControlled'])
            page=browser.new_page(viewport={'width':1440,'height':900}, locale='en-US')
            for name,url in urls.items():
              try:
                resp=page.goto(url,wait_until='domcontentloaded',timeout=60000)
                page.wait_for_timeout(4000)
                html=page.content()
                print('MARKET',name,'status',resp.status if resp else None,'bytes',len(html),'rcnt',html.count('rcnt'))
                for n in needles: print(' ',('FOUND' if n.lower() in html.lower() else 'MISSING'),n)
              except Exception as e:
                print('MARKET',name,'ERROR',repr(e))
            browser.close()
          PY
