name: Probe Forebet Market Row Structures
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_jina_html.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspect free O-U markdown and corners HTML rows
        shell: bash
        run: |
          set -euo pipefail
          curl -LsS --fail --max-time 90 'https://r.jina.ai/https://www.forebet.com/en/football-predictions/under-over-25-goals/2026-09-16/by-league' -H 'x-timeout: 30' -o /tmp/ou.md
          echo '--- OU SPARTAK CONTEXT ---'
          grep -n -i -A5 -B5 'Spartak Moscow' /tmp/ou.md | head -80 || true
          echo '--- OU RODINA CONTEXT ---'
          grep -n -i -A5 -B5 'Rodina Moscow' /tmp/ou.md | head -80 || true
          curl -LsS --fail --max-time 90 'https://r.jina.ai/https://www.forebet.com/en/football-tips-and-predictions-for-today/corners' -H 'x-respond-with: html' -H 'x-timeout: 30' -o /tmp/corners.html
          python - <<'PY'
from bs4 import BeautifulSoup
s=BeautifulSoup(open('/tmp/corners.html',encoding='utf-8',errors='ignore').read(),'html.parser')
for needle in ['Spartak Moscow','Wahda Abu Dhabi']:
    found=None
    for r in s.select('div.rcnt'):
        if needle.lower() in r.get_text(' ',strip=True).lower(): found=r; break
    print('--- CORNER ROW',needle,'---')
    if not found:
        print('MISSING'); continue
    print('TEXT', ' | '.join(found.stripped_strings)[:1600])
    for sel in ['div.fprc span','.forepr','.ex_sc','.avg_sc','.predict_score','.haodd span']:
        print(sel,[x.get_text(' ',strip=True) for x in found.select(sel)])
    print('CLASSES',sorted({c for t in found.find_all(True) for c in (t.get('class') or [])})[:160])
PY
