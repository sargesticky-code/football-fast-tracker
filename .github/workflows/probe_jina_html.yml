name: Probe Forebet Final Parser Structure
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_jina_html.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install parser
        run: pip install beautifulsoup4 lxml
      - name: Inspect O-U markdown and corners HTML
        shell: bash
        run: |
          set -euo pipefail
          curl -LsS --fail --max-time 90 'https://r.jina.ai/https://www.forebet.com/en/football-predictions/under-over-25-goals/2026-09-16/by-league' -H 'x-timeout: 30' -o /tmp/ou.md
          echo '--- OU WA HDA CONTEXT ---'
          grep -n -i -A14 -B8 'Wahda Abu Dhabi' /tmp/ou.md | head -100 || true
          echo '--- OU SPARTAK CONTEXT ---'
          grep -n -i -A14 -B8 'Spartak Moscow' /tmp/ou.md | head -100 || true
          curl -LsS --fail --max-time 90 'https://r.jina.ai/https://www.forebet.com/en/football-tips-and-predictions-for-today/corners' -H 'x-respond-with: html' -H 'x-timeout: 30' -o /tmp/corners.html
          python - <<'PY'
from bs4 import BeautifulSoup
s=BeautifulSoup(open('/tmp/corners.html',encoding='utf-8',errors='ignore').read(),'lxml')
for needle in ['Spartak Moscow','Wahda Abu Dhabi']:
    found=next((r for r in s.select('div.rcnt') if needle.lower() in r.get_text(' ',strip=True).lower()),None)
    print('--- CORNER ROW',needle,'---')
    if not found:
        print('MISSING'); continue
    print('TEXT', ' | '.join(found.stripped_strings)[:1800])
    for sel in ['span.homeTeam span[itemprop="name"]','span.awayTeam span[itemprop="name"]','div.fprc span','.forepr','.ex_sc','.avg_sc','.predict_score','.haodd span']:
        print(sel,[x.get_text(' ',strip=True) for x in found.select(sel)])
    print('CLASSES',sorted({c for t in found.find_all(True) for c in (t.get('class') or [])})[:180])
PY
