name: Probe Jina Forebet Routine Markets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_jina_html.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe free high-row Forebet market pages
        shell: bash
        run: |
          set -euo pipefail
          declare -A URLS
          URLS[one]='https://www.forebet.com/en/football-tips-and-predictions-for-today/predictions-1x2/by-league/1000'
          URLS[ou]='https://www.forebet.com/en/football-tips-and-predictions-for-today/predictions-under-over-goals/by-league/1000'
          URLS[corners]='https://www.forebet.com/en/football-tips-and-predictions-for-today/corners/by-league/1000'
          for M in one ou corners; do
            OUT="/tmp/$M.html"
            if ! curl -LsS --fail --max-time 90 "https://r.jina.ai/${URLS[$M]}" -H 'x-respond-with: html' -H 'x-timeout: 30' -o "$OUT"; then
              echo "MARKET=$M FETCH_FAILED"; continue
            fi
            RCNT=$(python -c 'import re,sys; s=open(sys.argv[1],encoding="utf-8",errors="ignore").read(); print(len(re.findall(r"class=\"[^\"]*rcnt",s)))' "$OUT")
            echo "MARKET=$M bytes=$(wc -c <"$OUT") rcnt=$RCNT"
            for needle in 'Spartak Moscow' 'Rodina Moscow' 'Wahda Abu Dhabi' 'Al Khaldiya'; do
              if grep -Fqi "$needle" "$OUT"; then echo "  FOUND $needle"; else echo "  MISSING $needle"; fi
            done
          done
