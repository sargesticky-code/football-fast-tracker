name: Probe Jina Forebet Routine Markets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_jina_html.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe free Forebet component transport variants
        shell: bash
        run: |
          set -euo pipefail
          URLS=(
            'https://r.jina.ai/https://www.forebet.com/en/component/forebet/under-over'
            'https://r.jina.ai/http://www.forebet.com/en/component/forebet/under-over'
            'https://r.jina.ai/https://www.forebet.com/en/football-tips-and-predictions-for-today/corners'
            'https://r.jina.ai/https://www.forebet.com/en/football-predictions/predictions-1x2?start=2'
          )
          NAMES=(ou_https ou_http corners one_generic)
          for i in "${!URLS[@]}"; do
            M="${NAMES[$i]}"; OUT="/tmp/$M.html"
            if ! curl -LsS --fail --max-time 90 "${URLS[$i]}" -H 'x-respond-with: html' -H 'x-timeout: 30' -o "$OUT"; then
              echo "MARKET=$M FETCH_FAILED"; continue
            fi
            RCNT=$(python -c 'import re,sys; s=open(sys.argv[1],encoding="utf-8",errors="ignore").read(); print(len(re.findall(r"class=\"[^\"]*rcnt",s)))' "$OUT")
            echo "MARKET=$M bytes=$(wc -c <"$OUT") rcnt=$RCNT"
            for needle in 'Spartak Moscow' 'Rodina Moscow' 'Wahda Abu Dhabi' 'Al Khaldiya'; do
              if grep -Fqi "$needle" "$OUT"; then echo "  FOUND $needle"; else echo "  MISSING $needle"; fi
            done
          done
