name: Probe Forebet Free OU Markdown
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_jina_html.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe Jina markdown O-U
        shell: bash
        run: |
          set -euo pipefail
          URLS=(
            'https://www.forebet.com/en/football-tips-and-predictions-for-today/predictions-under-over-goals?task=under-over'
            'https://www.forebet.com/en/component/forebet/under-over'
            'https://www.forebet.com/en/football-predictions/under-over-25-goals/2026-09-16/by-league'
          )
          NAMES=(task component date)
          for i in "${!URLS[@]}"; do
            M="${NAMES[$i]}"; OUT="/tmp/$M.md"
            if ! curl -LsS --fail --max-time 90 "https://r.jina.ai/${URLS[$i]}" -H 'x-timeout: 30' -o "$OUT"; then
              echo "OU=$M FETCH_FAILED"; continue
            fi
            echo "OU=$M bytes=$(wc -c <"$OUT")"
            head -5 "$OUT" | sed 's/^/  /'
            for needle in 'Spartak Moscow' 'Rodina Moscow' 'Wahda Abu Dhabi' 'Al Khaldiya' 'Under' 'Over'; do
              if grep -Fqi "$needle" "$OUT"; then echo "  FOUND $needle"; else echo "  MISSING $needle"; fi
            done
          done
