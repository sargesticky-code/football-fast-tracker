name: Probe Jina Forebet Markets
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/probe_jina_html.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Probe generic Forebet market pages
        shell: bash
        run: |
          set -euo pipefail
          declare -A URLS
          URLS[one]='https://www.forebet.com/en/football-predictions/predictions-1x2/2026-09-16/by-league'
          URLS[ou]='https://www.forebet.com/en/football-predictions/under-over-25-goals/2026-09-16/by-league'
          URLS[corners]='https://www.forebet.com/en/football-predictions/corners'
          for M in one ou corners; do
            OUT="/tmp/$M.html"
            curl -LsS --fail --max-time 90 "https://r.jina.ai/${URLS[$M]}" -H 'x-respond-with: html' -H 'x-timeout: 25' -o "$OUT"
            RCNT=$(python -c 'import re,sys; s=open(sys.argv[1],encoding="utf-8",errors="ignore").read(); print(len(re.findall(r"class=\"[^\"]*rcnt",s)))' "$OUT")
            echo "MARKET=$M bytes=$(wc -c <"$OUT") rcnt=$RCNT"
            for needle in 'Spartak Moscow' 'Rodina Moscow' 'Wahda Abu Dhabi' 'Al Khaldiya'; do
              if grep -Fqi "$needle" "$OUT"; then echo "  FOUND $needle"; else echo "  MISSING $needle"; fi
            done
          done
