name: Forebet Daily Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * *' # 06:45 Hong Kong time
  push:
    branches: [main]
    paths:
      - '.github/workflows/forebet_daily.yml'

permissions:
  contents: write

concurrency:
  group: forebet-daily-feed
  cancel-in-progress: true

jobs:
  scrape:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'RUN FOREBET SELECTIVE TEST')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      HKJC_GATE_ONLY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Forebet only for HKJC target date
        run: python scripts/scrape_forebet.py

      - name: Validate selective feed
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          t = Path('data/hkjc_targets.csv')
          f = Path('data/forebet_current.csv')
          with t.open(encoding='utf-8-sig', newline='') as fh:
              targets = list(csv.DictReader(fh))
          with f.open(encoding='utf-8-sig', newline='') as fh:
              feed = list(csv.DictReader(fh))
          if not targets:
              raise SystemExit('zero HKJC targets')
          if not feed:
              raise SystemExit('zero HKJC-matched Forebet rows')
          target_ids = {r['hkjc_event_id'] for r in targets}
          bad = [r for r in feed if r.get('hkjc_event_id') not in target_ids]
          if bad:
              raise SystemExit(f'feed contains {len(bad)} non-HKJC rows')
          print(f'PASS targets={len(targets)} kept={len(feed)} non_hkjc=0')
          PY
