name: Forebet Daily Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * *' # 06:45 Hong Kong time
    - cron: '45 10 * * *' # 18:45 Hong Kong time
  push:
    paths:
      - 'scripts/normalize_hkjc.py'
      - 'scripts/run_selective.py'
      - 'scripts/run_selective_v2.py'
      - 'scripts/forebet_match_policy.py'
      - 'scripts/forebet_target_recovery.py'
      - 'scripts/forebet_detail_parser.py'
      - 'scripts/forebet_availability.py'
      - 'scripts/reconcile_forebet_availability.py'
      - 'scripts/restore_active_forebet.py'
      - 'scripts/update_forebet_alias_registry.py'
      - 'scripts/enrich_forebet_markets.py'
      - 'scripts/enrich_forebet_form.py'
      - 'scripts/normalize_forebet_text.py'
      - 'scripts/enrich_power_ratings.py'
      - 'scripts/archive_forebet.py'
      - 'data/team_alias_manual.csv'
      - '.github/workflows/forebet_daily.yml'

permissions:
  contents: write

concurrency:
  group: forebet-daily-feed
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HKJC_GATE_ONLY: '0'
      HKJC_UPSTREAM_SHA: '1d2234102dc8f1ee23d0b45c25c125dc3ef98176'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Capture HKJC directly from official GraphQL
        run: |
          rm -rf /tmp/hkjc-direct
          git clone --filter=blob:none --no-checkout https://github.com/sososo829/hkjc-football-scraper.git /tmp/hkjc-direct
          git -C /tmp/hkjc-direct fetch --depth 1 origin "$HKJC_UPSTREAM_SHA"
          git -C /tmp/hkjc-direct checkout --detach "$HKJC_UPSTREAM_SHA"
          cd /tmp/hkjc-direct
          python -m hkjc list --format json --out /tmp/hkjc_matches.json
          python -m hkjc odds --page HAD --format json --out /tmp/hkjc_had.json
          cd "$GITHUB_WORKSPACE"
          python scripts/normalize_hkjc.py \
            --matches /tmp/hkjc_matches.json \
            --had /tmp/hkjc_had.json \
            --horizon-hours 36 \
            --live-retain-minutes 150

      - name: Fetch Forebet 1X2 with durable HKJC matching policy
        run: python scripts/run_selective_v2.py

      - name: Restore active Forebet models from rolling archive
        run: python scripts/restore_active_forebet.py

      - name: Reconcile availability with active model feed
        run: python scripts/reconcile_forebet_availability.py

      - name: Learn permanent Forebet team aliases
        run: python scripts/update_forebet_alias_registry.py

      - name: Validate core Forebet match feed
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          targets_path = Path('data/hkjc_targets.csv')
          feed_path = Path('data/forebet_current.csv')
          availability_path = Path('data/forebet_availability.csv')
          aliases_path = Path('data/team_alias_registry.csv')
          for path in (targets_path, feed_path, availability_path, aliases_path):
              if not path.exists(): raise SystemExit(f'missing core production file: {path}')
          def read(path):
              with path.open(encoding='utf-8-sig', newline='') as fh: return list(csv.DictReader(fh))
          targets, feed = read(targets_path), read(feed_path)
          availability, aliases = read(availability_path), read(aliases_path)
          if not targets or not feed or not availability: raise SystemExit('zero core production rows')
          target_ids = {r.get('hkjc_event_id') for r in targets if r.get('hkjc_event_id')}
          availability_ids = {r.get('hkjc_event_id') for r in availability if r.get('hkjc_event_id')}
          feed_ids = {r.get('hkjc_event_id') for r in feed if r.get('hkjc_event_id')}
          if feed_ids - target_ids: raise SystemExit('non-HKJC Forebet row')
          if target_ids - availability_ids: raise SystemExit('Forebet availability missing HKJC targets')
          if len(feed) != len(feed_ids): raise SystemExit('duplicate Forebet HKJC event')
          if any(not all(r.get(k) for k in ('prob_home','prob_draw','prob_away')) for r in feed): raise SystemExit('model-empty Forebet row')
          allowed = {'MODEL', 'FIXTURE_ONLY', 'UNRESOLVED'}
          if any(r.get('state') not in allowed for r in availability): raise SystemExit('invalid Forebet availability state')
          state_by_id = {r.get('hkjc_event_id'): r.get('state') for r in availability if r.get('hkjc_event_id')}
          non_model_feed = sorted(event_id for event_id in feed_ids if state_by_id.get(event_id) != 'MODEL')
          if non_model_feed: raise SystemExit('current model rows not marked MODEL: ' + ','.join(non_model_feed))
          stale_model_states = sorted(event_id for event_id, state in state_by_id.items() if state == 'MODEL' and event_id not in feed_ids)
          if stale_model_states: raise SystemExit('MODEL availability without current model row: ' + ','.join(stale_model_states))
          active_aliases = [r for r in aliases if r.get('status') in ('ACTIVE','MANUAL')]
          if not active_aliases: raise SystemExit('alias registry has no active rows')
          ratio = len(feed) / len(availability)
          states = {state: sum(r.get('state') == state for r in availability) for state in allowed}
          if ratio < 0.40: raise SystemExit(f'Forebet core coverage too low: {len(feed)}/{len(availability)} ({ratio:.1%})')
          print(f"CORE_PASS targets={len(availability)} forebet={len(feed)} coverage={ratio:.1%} aliases={len(active_aliases)} states={states}")
          PY

      - name: Checkpoint Forebet-owned core feeds
        run: |
          git config user.name 'fast-tracker-bot'
          git config user.email 'actions@users.noreply.github.com'
          # HKJC live/current files are owned by the 10-minute HKJC workflow.
          # Restore them before syncing so the two automations never commit the
          # same files and therefore cannot create data-file rebase conflicts.
          git restore --source=HEAD -- data/hkjc_current.csv data/hkjc_targets.csv
          git add data/forebet_current.csv data/forebet_availability.csv data/team_alias_registry.csv
          if git diff --cached --quiet; then
            echo 'No Forebet core feed changes to checkpoint.'
          else
            git commit -m 'Checkpoint Forebet model and availability feeds [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo 'Forebet core checkpoint push failed after retries.' >&2
                exit 1
              fi
              echo "Forebet checkpoint raced with another writer; retrying ($attempt/4)."
              sleep 2
            done
          fi

      - name: Add independent Opta global power ratings
        continue-on-error: true
        run: python scripts/enrich_power_ratings.py

      - name: Add Forebet O-U and corner signals from free match pages
        run: python scripts/enrich_forebet_markets.py

      - name: Add recent Forebet team form from match-detail pages
        continue-on-error: true
        run: python scripts/enrich_forebet_form.py

      - name: Normalize Forebet scores for Google Sheets
        run: python scripts/normalize_forebet_text.py

      - name: Persist rolling Forebet event archive
        run: python scripts/archive_forebet.py --bootstrap-ref 3e91d22ef028fe4ec230e205e1a73efece76d568

      - name: Validate production feeds
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          paths = {
              'current': Path('data/hkjc_current.csv'),
              'targets': Path('data/hkjc_targets.csv'),
              'feed': Path('data/forebet_current.csv'),
              'availability': Path('data/forebet_availability.csv'),
              'archive': Path('data/forebet_archive.csv'),
              'aliases': Path('data/team_alias_registry.csv'),
              'ratings': Path('data/power_ratings.csv'),
          }
          for label, path in paths.items():
              if not path.exists(): raise SystemExit(f'missing production file {label}: {path}')
          def read(path):
              with path.open(encoding='utf-8-sig', newline='') as fh: return list(csv.DictReader(fh))
          current, targets, feed = read(paths['current']), read(paths['targets']), read(paths['feed'])
          availability = read(paths['availability'])
          archive, aliases, ratings = read(paths['archive']), read(paths['aliases']), read(paths['ratings'])
          if not current or not targets or not feed or not availability: raise SystemExit('zero production rows')
          availability_ids = {r['hkjc_event_id'] for r in availability if r.get('hkjc_event_id')}
          feed_ids = {r['hkjc_event_id'] for r in feed if r.get('hkjc_event_id')}
          if feed_ids - availability_ids: raise SystemExit('Forebet feed row missing from run availability universe')
          if len(feed) != len(feed_ids): raise SystemExit('duplicate Forebet HKJC event')
          if any(not all(r.get(k) for k in ('prob_home','prob_draw','prob_away')) for r in feed): raise SystemExit('model-empty Forebet row')
          state_by_id = {r.get('hkjc_event_id'): r.get('state') for r in availability if r.get('hkjc_event_id')}
          non_model_feed = sorted(event_id for event_id in feed_ids if state_by_id.get(event_id) != 'MODEL')
          if non_model_feed: raise SystemExit('final model rows not marked MODEL: ' + ','.join(non_model_feed))
          stale_model_states = sorted(event_id for event_id, state in state_by_id.items() if state == 'MODEL' and event_id not in feed_ids)
          if stale_model_states: raise SystemExit('final MODEL availability without current model row: ' + ','.join(stale_model_states))
          archive_ids = {r.get('hkjc_event_id') for r in archive}
          if any(r['hkjc_event_id'] not in archive_ids for r in feed): raise SystemExit('archive missing current event')
          allowed = {'MODEL', 'FIXTURE_ONLY', 'UNRESOLVED'}
          if any(r.get('state') not in allowed for r in availability): raise SystemExit('invalid Forebet availability state')
          active_aliases = [r for r in aliases if r.get('status') in ('ACTIVE','MANUAL')]
          if not active_aliases: raise SystemExit('alias registry has no active rows')
          if len(ratings) < 5000:
              print(f'WARN Opta snapshot suspiciously small: {len(ratings)}')
          rated_sides = sum(bool(r.get('power_home')) + bool(r.get('power_away')) for r in feed)
          ou = sum(bool(r.get('prediction_ou25')) for r in feed)
          corners = sum(bool(r.get('corner_prediction')) for r in feed)
          detail = sum(bool(r.get('forebet_detail_url')) for r in feed)
          model_ratio = len(feed) / len(availability)
          ou_ratio = ou / len(feed)
          corner_ratio = corners / len(feed)
          fixture_only = sum(r.get('state') == 'FIXTURE_ONLY' for r in availability)
          unresolved = sum(r.get('state') == 'UNRESOLVED' for r in availability)
          if model_ratio < 0.40:
              raise SystemExit(f'Forebet model coverage too low: {len(feed)}/{len(availability)} ({model_ratio:.1%})')
          if ou_ratio < 0.25:
              print(f'WARN Forebet O-U coverage low: {ou}/{len(feed)} ({ou_ratio:.1%})')
          if corner_ratio < 0.25:
              print(f'WARN Forebet corner coverage low: {corners}/{len(feed)} ({corner_ratio:.1%})')
          if detail and not (ou or corners):
              print('WARN Forebet detail pages resolved but no O-U/corner signals parsed')
          print(
              f"PASS hkjc_current={len(current)} live_targets={len(targets)} run_targets={len(availability)} "
              f"forebet={len(feed)} fixture_only={fixture_only} unresolved={unresolved} "
              f"archive={len(archive)} aliases={len(aliases)} power={rated_sides}/{len(feed)*2} "
              f"detail={detail} model_coverage={model_ratio:.1%} "
              f"ou25={ou} ({ou_ratio:.1%}) corners95={corners} ({corner_ratio:.1%}) scraperapi_credits=0"
          )
          PY

      - name: Commit refreshed Forebet production feeds
        run: |
          git config user.name 'fast-tracker-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/forebet_current.csv data/forebet_availability.csv data/forebet_archive.csv data/team_alias_registry.csv
          if [ -f data/forebet_form_current.csv ]; then git add data/forebet_form_current.csv; fi
          if [ -f data/power_ratings.csv ]; then git add data/power_ratings.csv; fi
          if git diff --cached --quiet; then
            echo 'No Forebet feed changes to commit.'
          else
            git commit -m 'Update zero-credit Forebet model feeds [skip ci]'
            for attempt in 1 2 3 4; do
              git pull --rebase origin main
              if git push; then
                break
              fi
              if [ "$attempt" -eq 4 ]; then
                echo 'Final Forebet feed push failed after retries.' >&2
                exit 1
              fi
              echo "Final Forebet push raced with another writer; retrying ($attempt/4)."
              sleep 2
            done
          fi
