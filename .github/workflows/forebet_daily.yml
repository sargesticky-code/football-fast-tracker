name: Forebet Daily Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * *' # 06:45 Hong Kong time
  push:
    paths:
      - 'scripts/enrich_power_ratings.py'
      - '.github/workflows/forebet_daily.yml'

permissions:
  contents: write

concurrency:
  group: forebet-daily-feed
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      HKJC_GATE_ONLY: '0'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch Forebet only for HKJC fixtures
        run: python scripts/run_selective.py

      - name: Add independent Opta global power ratings
        run: python scripts/enrich_power_ratings.py

      - name: Validate selective feed
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path

          target_path = Path('data/hkjc_targets.csv')
          feed_path = Path('data/forebet_current.csv')
          ratings_path = Path('data/power_ratings.csv')
          with target_path.open(encoding='utf-8-sig', newline='') as fh:
              targets = list(csv.DictReader(fh))
          with feed_path.open(encoding='utf-8-sig', newline='') as fh:
              feed = list(csv.DictReader(fh))

          if not targets:
              raise SystemExit('zero HKJC targets')
          if not feed:
              raise SystemExit('zero HKJC-matched Forebet rows')

          target_ids = {r['hkjc_event_id'] for r in targets}
          bad = [r for r in feed if r.get('hkjc_event_id') not in target_ids]
          if bad:
              raise SystemExit(f'feed contains {len(bad)} non-HKJC rows')

          duplicates = len(feed) - len({r['hkjc_event_id'] for r in feed})
          if duplicates:
              raise SystemExit(f'feed contains {duplicates} duplicate HKJC events')

          bad_probs = [r for r in feed if not all(r.get(k) for k in ('prob_home','prob_draw','prob_away'))]
          if bad_probs:
              raise SystemExit(f'feed contains {len(bad_probs)} model-empty rows')

          if not ratings_path.exists():
              raise SystemExit('no Opta power-rating snapshot')
          with ratings_path.open(encoding='utf-8-sig', newline='') as fh:
              ratings = list(csv.DictReader(fh))
          if len(ratings) < 5000:
              raise SystemExit(f'Opta snapshot suspiciously small: {len(ratings)}')

          rated_sides = sum(bool(r.get('power_home')) + bool(r.get('power_away')) for r in feed)
          total_sides = len(feed) * 2
          min_sides = max(1, len(feed))  # at least 50% of team-sides
          if rated_sides < min_sides:
              raise SystemExit(f'Opta coverage too low: {rated_sides}/{total_sides}')

          print(
              f'PASS targets={len(targets)} kept={len(feed)} non_hkjc=0 '
              f'duplicates=0 model_empty=0 opta_snapshot={len(ratings)} '
              f'power={rated_sides}/{total_sides}'
          )
          PY

      - name: Commit refreshed selective feed
        run: |
          git config user.name 'fast-tracker-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/hkjc_targets.csv data/forebet_current.csv
          if [ -f data/power_ratings.csv ]; then
            git add data/power_ratings.csv
          fi
          if git diff --cached --quiet; then
            echo 'No feed changes to commit.'
          else
            git commit -m 'Update HKJC-gated Forebet and Opta power feed [skip ci]'
            git push
          fi
