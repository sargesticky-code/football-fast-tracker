name: Forebet Daily Feed

on:
  workflow_dispatch:
  schedule:
    - cron: '45 22 * * *' # 06:45 Hong Kong time
  push:
    branches: [main]
    paths:
      - '.github/workflows/forebet_daily.yml'

permissions:
  contents: write

concurrency:
  group: forebet-daily-feed
  cancel-in-progress: true

jobs:
  scrape:
    if: github.event_name != 'push' || contains(github.event.head_commit.message, 'RUN HKJC GATE TEST')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SCRAPERAPI_KEY: ${{ secrets.SCRAPERAPI_KEY }}
      HKJC_GATE_ONLY: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build exact HKJC fixture gate
        run: python scripts/scrape_forebet.py

      - name: Validate HKJC target CSV
        run: |
          python - <<'PY'
          import csv
          from pathlib import Path
          p = Path('data/hkjc_targets.csv')
          with p.open(encoding='utf-8-sig', newline='') as f:
              rows = list(csv.DictReader(f))
          if not rows:
              raise SystemExit('HKJC target CSV has zero rows')
          print(f'Validated {len(rows)} exact HKJC HAD targets; no ScraperAPI call made')
          PY
