name: FotMob H2H Adapter Tests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fotmob_h2h.py'
      - 'scripts/fotmob_h2h_worker.py'
      - 'tests/test_fotmob_h2h.py'
      - 'tests/test_fotmob_h2h_worker.py'
      - '.github/workflows/fotmob_h2h_tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests==2.32.5
      - run: python -m unittest tests.test_fotmob_h2h tests.test_fotmob_h2h_worker -v
