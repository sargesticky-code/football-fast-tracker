[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multibetter"
version = "0.1.0"
description = "Multi-source football prediction normalization, matching and consensus framework"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.32",
  "beautifulsoup4>=4.12",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
